          document.querySelectorAll('.approve-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const correctionId = this.getAttribute('data-correction');
              const correction = App.corrections.find(c => c.id === correctionId);
              if (!correction) return;

              // 新形式（timeCorrection）か旧形式かで処理を分ける
              if (correction.type === 'timeCorrection') {
                // 新形式：承認で出勤記録を追加
                const startTime = String(correction.startHour).padStart(2,'0') + ':' + String(correction.startMin).padStart(2,'0');
                const endTime = correction.endHour !== null ? String(correction.endHour).padStart(2,'0') + ':' + String(correction.endMin).padStart(2,'0') : '未設定';
                
                if (!confirm(
                  `この修正申請を承認し、出勤記録を追加しますか？\n\n` +
                  `従業員: ${correction.employeeName}\n` +
                  `日付: ${correction.workDate}\n` +
                  `現場: ${correction.jobSiteName}\n` +
                  `始業: ${startTime}\n` +
                  `終業: ${endTime}`
                )) return;
                
                // 出勤記録を作成（【v3.2.0】JST明示で端末TZ非依存に）
                const clockInDate = App.jstDateTime(correction.workDate, correction.startHour, correction.startMin);
                
                let clockOutDate = null;
                let workHours = null;
                let status = 'working';
                
                if (correction.endHour !== null) {
                  clockOutDate = App.jstDateTime(correction.workDate, correction.endHour, correction.endMin);
                  // 終業が始業より早い場合は翌日
                  if (clockOutDate <= clockInDate) {
                    clockOutDate = new Date(clockOutDate.getTime() + 24 * 60 * 60 * 1000);
                  }
                  workHours = (clockOutDate - clockInDate) / (1000 * 60 * 60);
                  workHours = Math.round(workHours * 100) / 100;
                  status = 'completed';
                }
                
                // 夜勤判定
                const shiftType = (correction.startHour >= 17 || correction.startHour < 5) ? 'night' : 'day';
                
                // 同日・同シフトの既存記録をチェック
                const existingRecord = App.records.find(r => 
                  r.employeeId === correction.employeeId &&
                  r.workDate === correction.workDate &&
                  r.shiftType === shiftType
                );
                
                if (existingRecord) {
                  // 既存記録を上書き
                  existingRecord.jobSiteId = correction.jobSiteId;
                  existingRecord.jobSiteName = correction.jobSiteName;
                  existingRecord.clockInTime = clockInDate.toISOString();
                  existingRecord.clockOutTime = clockOutDate ? clockOutDate.toISOString() : null;
                  existingRecord.workHours = workHours;
                  existingRecord.status = status;
                  existingRecord.memo = correction.comment || '';
                  existingRecord.updatedBy = App.currentUser.name;
                  existingRecord.updatedAt = new Date().toISOString();
                  existingRecord.fromCorrection = true;
                } else {
                  // 新規記録を追加
                  const newRecord = {
                    id: Date.now().toString(),
                    employeeId: correction.employeeId,
                    employeeName: correction.employeeName,
                    jobSiteId: correction.jobSiteId,
                    jobSiteName: correction.jobSiteName,
                    workDate: correction.workDate,
                    clockInTime: clockInDate.toISOString(),
                    clockOutTime: clockOutDate ? clockOutDate.toISOString() : null,
                    shiftType: shiftType,
                    workHours: workHours,
                    status: status,
                    memo: correction.comment || '',
                    addedBy: App.currentUser.name,
                    addedAt: new Date().toISOString(),
                    fromCorrection: true
                  };
                  
                  App.records.push(newRecord);
                }
                
                correction.status = 'approved';
                correction.processedAt = new Date().toISOString();
                
                App.save();
                alert(existingRecord ? '承認しました。既存の出勤記録を上書きしました。' : '承認しました。出勤記録を追加しました。');
              } else {
                // 旧形式：承認で記録削除
                if (!confirm('この修正依頼を承認し、該当の勤怠記録を削除しますか？')) return;
                
                App.markRecordsDeleted([correction.recordId]); // 【v3.2.0】tombstone登録で復活防止
                App.records = App.records.filter(r => r.id !== correction.recordId);
                correction.status = 'approved';
                correction.processedAt = new Date().toISOString();
                
                App.save();
                alert('承認しました。勤怠記録を削除しました。');
              }
              
              self.render('correctionList');
            });
          });

          // 却下ボタン
          document.querySelectorAll('.reject-btn').forEach(function(btn) {

                App.save();
                alert('却下しました。');

              self.render('correctionList');

        // 残業申請管理
        if (view === 'overtimeRequestList') {
          // 承認

            btn.addEventListener('click', function() {
              const requestId = this.getAttribute('data-request');
              const request = App.overtimeRequests.find(r => r.id === requestId);
              
              if (!request) return;
              if (!confirm(`${request.employeeName}の残業申請（${request.workDate}、${request.hours}時間）を承認しますか？`)) return;
              
              // ステータスを承認に変更

              request.approvedAt = new Date().toISOString();

              );
              if (targetRecord) {
                targetRecord.overtimeHours = (targetRecord.overtimeHours || 0) + request.hours;
              }
              
              App.save();
              alert('承認しました。勤怠記録に残業時間が反映されました。');
              self.render('overtimeRequestList');
            });
          });
          
          // 却下
          document.querySelectorAll('.reject-overtime-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const requestId = this.getAttribute('data-request');
              const request = App.overtimeRequests.find(r => r.id === requestId);
              
              if (!request) return;
              if (!confirm(`${request.employeeName}の残業申請を却下しますか？`)) return;
              
              request.status = 'rejected';
              request.rejectedAt = new Date().toISOString();
              App.save();
              alert('却下しました。');
              self.render('overtimeRequestList');
            });
          });
          
          // 削除
          document.querySelectorAll('.delete-overtime-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const requestId = this.getAttribute('data-request');
              const request = App.overtimeRequests.find(r => r.id === requestId);
              
              if (!request) return;
              if (!confirm('この残業申請を削除しますか？\n承認済みの場合、勤怠記録の残業時間も取り消されます。')) return;
              
              // 承認済みなら勤怠記録から残業時間を減らす
              if (request.status === 'approved') {
                const targetRecord = App.records.find(r =>

                  r.workDate === request.workDate &&
                  r.status === 'completed'
                );

                  targetRecord.overtimeHours = Math.max(0, targetRecord.overtimeHours - request.hours);

              App.overtimeRequests = App.overtimeRequests.filter(r => r.id !== requestId);
              App.save();
              alert('削除しました。');
              self.render('overtimeRequestList');
            });

          // 直接追加
          const addOvertimeDirectBtn = document.getElementById('addOvertimeDirectBtn');
          if (addOvertimeDirectBtn) {

              if (!employeeId || !workDate) {

              );

              }

              if (!App.overtimeRequests) App.overtimeRequests = [];

              self.render('overtimeRequestList');

        // お知らせ送信
        if (view === 'announcement') {

          const sendBtn = document.getElementById('sendAnnouncementBtn');

          // バックアップ出力
          const exportBackup = document.getElementById('exportBackup');
          if (exportBackup) {
            exportBackup.addEventListener('click', function() {
              const backupData = {
                exportDate: new Date().toISOString(),
                version: '1.0',
                data: {
                  employees: App.employees,
                  jobSites: App.jobSites,
                  records: App.records,
                  corrections: App.corrections,
                  addressRequests: App.addressRequests,
                  siteDailyReports: App.siteDailyReports,
                  siteFinanceData: App.siteFinanceData,
                  deletedEmployees: App.deletedEmployees,
                  overtimeRequests: App.overtimeRequests || [],
                  monthlyConfirmations: App.monthlyConfirmations || {},
                  deletedRecordIds: App.deletedRecordIds || [],
                  announcement: App.announcement || null
                }
              };
              
              const json = JSON.stringify(backupData, null, 2);
              const blob = new Blob([json], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              
              const today = App.getToday();
              const a = document.createElement('a');
              a.href = url;
              a.download = 'kintai_backup_' + today + '.json';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              
              alert('バックアップファイルをダウンロードしました');
            });
          }
          
          // バックアップ復元
          const importBackup = document.getElementById('importBackup');
          if (importBackup) {
            importBackup.addEventListener('change', function(e) {
              const file = e.target.files[0];
              if (!file) return;
              
              const reader = new FileReader();
              reader.onload = function(event) {
                try {
                  const backupData = JSON.parse(event.target.result);
                  
                  if (!backupData.data) {
                    alert('無効なバックアップファイルです');
                    return;
                  }
                  
                  const exportDate = backupData.exportDate ? new Date(backupData.exportDate).toLocaleString('ja-JP') : '不明';
                  
                  if (confirm('バックアップを復元しますか？\n\n出力日時: ' + exportDate + '\n\n現在のデータは上書きされます。')) {
                    if (backupData.data.employees) App.employees = backupData.data.employees;
                    if (backupData.data.jobSites) App.jobSites = backupData.data.jobSites;
                    if (backupData.data.records) App.records = backupData.data.records;
                    if (backupData.data.corrections) App.corrections = backupData.data.corrections;
                    if (backupData.data.addressRequests) App.addressRequests = backupData.data.addressRequests;
                    if (backupData.data.siteDailyReports) App.siteDailyReports = backupData.data.siteDailyReports;
                    if (backupData.data.siteFinanceData) App.siteFinanceData = backupData.data.siteFinanceData;
                    if (backupData.data.deletedEmployees) App.deletedEmployees = backupData.data.deletedEmployees;
                    if (backupData.data.overtimeRequests) App.overtimeRequests = backupData.data.overtimeRequests;
                    if (backupData.data.monthlyConfirmations) App.monthlyConfirmations = backupData.data.monthlyConfirmations;
                    if (backupData.data.deletedRecordIds) App.deletedRecordIds = backupData.data.deletedRecordIds;
                    if (backupData.data.announcement !== undefined) App.announcement = backupData.data.announcement;
                    
                    App.save();
                    alert('バックアップを復元しました');
                    self.render('dataManagement');
                  }
                } catch (err) {
                  alert('ファイルの読み込みに失敗しました');
                }
              };
              reader.readAsText(file);
            });
          }
          
          // 6ヶ月以上前の勤怠記録削除
          const deleteOldRecords6m = document.getElementById('deleteOldRecords6m');
          if (deleteOldRecords6m) {
            deleteOldRecords6m.addEventListener('click', function() {
              const sixMonthsAgo = new Date();
              sixMonthsAgo.setMonth(sixMonthsAgo.getMonth() - 6);
              const sixMonthsAgoStr = sixMonthsAgo.toISOString().split('T')[0];
              const count = App.records.filter(r => r.workDate < sixMonthsAgoStr).length;
              
              if (confirm(`6ヶ月以上前の勤怠記録 ${count}件 を削除しますか？\nこの操作は取り消せません。`)) {
                // 【v3.2.0】tombstone登録（未登録だとマージで即復活し、削除が無効だった）
                App.markRecordsDeleted(App.records.filter(r => r.workDate < sixMonthsAgoStr).map(r => r.id));
                App.records = App.records.filter(r => r.workDate >= sixMonthsAgoStr);
                App.save();
                alert(`${count}件の勤怠記録を削除しました`);
                self.render('dataManagement');
              }
            });
          }
          
          // 1年以上前の勤怠記録削除
          const deleteOldRecords1y = document.getElementById('deleteOldRecords1y');
          if (deleteOldRecords1y) {
            deleteOldRecords1y.addEventListener('click', function() {
              const oneYearAgo = new Date();
              oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
              const oneYearAgoStr = oneYearAgo.toISOString().split('T')[0];
              const count = App.records.filter(r => r.workDate < oneYearAgoStr).length;
              
              if (confirm(`1年以上前の勤怠記録 ${count}件 を削除しますか？\nこの操作は取り消せません。`)) {
                // 【v3.2.0】tombstone登録（未登録だとマージで即復活し、削除が無効だった）
                App.markRecordsDeleted(App.records.filter(r => r.workDate < oneYearAgoStr).map(r => r.id));
                App.records = App.records.filter(r => r.workDate >= oneYearAgoStr);
                App.save();
                alert(`${count}件の勤怠記録を削除しました`);
                self.render('dataManagement');
              }
            });
          }
          
          // 終了した現場削除
          const deleteCompletedSites = document.getElementById('deleteCompletedSites');
          if (deleteCompletedSites) {
            deleteCompletedSites.addEventListener('click', function() {
              const completedSites = App.jobSites.filter(s => s.completedDate);
              const count = completedSites.length;
              
              if (confirm(`終了した現場 ${count}件 を削除しますか？\n関連する収支データも削除されます。\nこの操作は取り消せません。`)) {
                const completedIds = completedSites.map(s => s.id);
                App.jobSites = App.jobSites.filter(s => !s.completedDate);
                // 関連する収支データも削除
                completedIds.forEach(id => {
                  Object.keys(App.siteFinanceData).forEach(key => {
                    if (key.startsWith(id + '_')) {
                      delete App.siteFinanceData[key];
                    }
                  });
                });
                App.save();
                alert(`${count}件の終了現場を削除しました`);
                self.render('dataManagement');
              }
            });
          }
          
          // 処理済み修正依頼削除
          const deleteProcessedCorrections = document.getElementById('deleteProcessedCorrections');
          if (deleteProcessedCorrections) {
            deleteProcessedCorrections.addEventListener('click', function() {
              const count = App.corrections.filter(c => c.status !== 'pending').length;
              
              if (confirm(`処理済みの修正依頼 ${count}件 を削除しますか？`)) {
                App.corrections = App.corrections.filter(c => c.status === 'pending');
                App.save();
                alert(`${count}件の修正依頼を削除しました`);
                self.render('dataManagement');
              }
            });
          }
          
          // 住所変更届削除
          const deleteAddressRequests = document.getElementById('deleteAddressRequests');
          if (deleteAddressRequests) {
            deleteAddressRequests.addEventListener('click', function() {
              const count = App.addressRequests.length;
              
              if (confirm(`住所変更届 ${count}件 を削除しますか？`)) {
                App.addressRequests = [];
                App.save();
                alert(`${count}件の住所変更届を削除しました`);
                self.render('dataManagement');
              }
            });
          }
          
          // 選択した現場を削除
          const deleteSelectedSites = document.getElementById('deleteSelectedSites');
          if (deleteSelectedSites) {
            deleteSelectedSites.addEventListener('click', function() {
              const checkedBoxes = document.querySelectorAll('.site-checkbox:checked');
              if (checkedBoxes.length === 0) {
                alert('削除する現場を選択してください');
                return;
              }
              
              const siteIds = Array.from(checkedBoxes).map(cb => cb.getAttribute('data-site-id'));
              const siteNames = siteIds.map(id => {
                const site = App.jobSites.find(s => s.id === id);
                return site ? site.name : '';
              }).filter(n => n);
              
              if (confirm(`以下の現場を削除しますか？\n\n${siteNames.join('\n')}\n\n関連する勤怠記録・収支データも削除されます。`)) {
                // 現場を削除
                App.jobSites = App.jobSites.filter(s => !siteIds.includes(s.id));
                
                // 関連する勤怠記録を削除（【v3.2.0】tombstone登録で復活防止）
                siteNames.forEach(name => {
                  App.markRecordsDeleted(App.records.filter(r => r.jobSiteName === name).map(r => r.id));
                  App.records = App.records.filter(r => r.jobSiteName !== name);
                });
                
                // 関連する収支データを削除
                siteIds.forEach(id => {
                  Object.keys(App.siteFinanceData).forEach(key => {
                    if (key.startsWith(id + '_')) {
                      delete App.siteFinanceData[key];
                    }
                  });
                });
                
                // 関連する日報データを削除
                siteNames.forEach(name => {
                  Object.keys(App.siteDailyReports).forEach(key => {
                    if (key.endsWith('_' + name)) {
                      delete App.siteDailyReports[key];
                    }
                  });
                });
                
                App.save();
                alert(`${siteNames.length}件の現場を削除しました`);
                self.render('dataManagement');
              }
            });
          }
          
          // 全データリセット
          const resetAllData = document.getElementById('resetAllData');
          if (resetAllData) {
            resetAllData.addEventListener('click', function() {
              if (confirm('⚠️ 確認 ⚠️\n\nこの端末に保存されたキャッシュを初期化しますか？\n\n※ クラウド（Firebase）上の勤怠記録・現場データは削除されません。\n再起動時にクラウドから最新データを取得し直します。')) {
                if (confirm('最終確認：この端末のキャッシュを初期化してよろしいですか？')) {
                  localStorage.clear();
                  alert('この端末のキャッシュを初期化しました。\nページをリロードします。');
                  location.reload();
                }
              }
            });
          }
        }

        // CSVエクスポート
        if (view === 'csvExport') {
          const exportMonth = document.getElementById('exportMonth');
          const previewCount = document.getElementById('previewCount');
          const exportBtn = document.getElementById('exportCsvBtn');

          // プレビュー更新
          function updatePreview() {
            const month = exportMonth.value;
            const records = App.records.filter(r => r.workDate && r.workDate.startsWith(month));
            previewCount.textContent = records.length;
          }

          if (exportMonth) {
            exportMonth.addEventListener('change', updatePreview);
            updatePreview();
          }

          if (exportBtn) {
            exportBtn.addEventListener('click', function() {
              const month = exportMonth.value;
              const exportType = document.querySelector('input[name="exportType"]:checked').value;
              const records = App.records.filter(r => r.workDate && r.workDate.startsWith(month));

              if (records.length === 0) {
                alert('選択した月のデータがありません');
                return;
              }

              // 【v3.2.0】CSVフィールドの安全化（カンマ・引用符・改行の破損防止／Excel数式インジェクション対策）
              function csvField(v) {
                let s = (v === null || v === undefined) ? '' : String(v);
                if (/^[=+\-@\t]/.test(s)) s = "'" + s;
                if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
                return s;
              }

              // 法定休憩時間を計算する関数
              function getBreakHours(workHours) {
                if (workHours <= 6) return 0;
                if (workHours <= 8) return 0.75; // 45分
                return 1; // 60分
              }

              let csv = '';
              const BOM = '\uFEFF';

              if (exportType === 'daily') {
                // 出勤一覧
                csv = '日付,従業員名,役割,現場名,始業時刻,終業時刻,勤務時間,休憩時間,実働時間,時給,日給,メモ\n';
                records.sort((a, b) => a.workDate.localeCompare(b.workDate)).forEach(r => {
                  const emp = App.employees.find(e => e.name === r.employeeName);
                  const role = emp ? (emp.role === 'parttime' ? 'アルバイト' : (emp.role === 'manager' ? '責任者' : '作業員')) : '作業員';
                  const isParttime = emp && emp.role === 'parttime';
                  const workHours = r.workHours || 0;
                  const breakHours = isParttime ? getBreakHours(workHours) : 0;
                  const actualHours = Math.max(0, workHours - breakHours);
                  // 記録に時給があればそれを使う
                  const recordRate = r.hourlyRate || (emp ? emp.hourlyRate : 0);
                  const dailyPay = isParttime ? Math.round(actualHours * recordRate) : (emp ? emp.dailyRate : 15000);
                  csv += `${r.workDate},${csvField(r.employeeName)},${role},${csvField(r.jobSiteName)},${App.formatTime(r.clockInTime)},${App.formatTime(r.clockOutTime)},${workHours.toFixed(1)},${breakHours.toFixed(2)},${actualHours.toFixed(1)},${isParttime ? recordRate : '-'},${dailyPay},${csvField(r.memo || '')}\n`;
                });
              } else if (exportType === 'summary') {
                // 月次集計
                csv = '従業員名,役割,始業日数,合計勤務時間,合計休憩時間,合計実働時間,給与概算\n';
                const summary = {};
                records.forEach(r => {
                  if (!summary[r.employeeName]) {
                    const emp = App.employees.find(e => e.name === r.employeeName);
                    summary[r.employeeName] = {
                      days: 0,
                      hours: 0,
                      breakHours: 0,
                      actualHours: 0,
                      totalPay: 0,
                      role: emp ? emp.role : 'worker',
                      dailyRate: emp ? emp.dailyRate : 15000,
                      hourlyRate: emp ? emp.hourlyRate : 0
                    };
                  }
                  if (r.status === 'completed') {
                    const workHours = r.workHours || 0;
                    const isParttime = summary[r.employeeName].role === 'parttime';
                    const breakHours = isParttime ? getBreakHours(workHours) : 0;
                    const actualHours = Math.max(0, workHours - breakHours);
                    summary[r.employeeName].days++;
                    summary[r.employeeName].hours += workHours;
                    summary[r.employeeName].breakHours += breakHours;
                    summary[r.employeeName].actualHours += actualHours;
                    // 記録の時給で計算（アルバイト）、または日当（正社員）
                    if (isParttime) {
                      const recordRate = r.hourlyRate || summary[r.employeeName].hourlyRate;
                      summary[r.employeeName].totalPay += Math.round(actualHours * recordRate);
                    } else {
                      summary[r.employeeName].totalPay += summary[r.employeeName].dailyRate;
                    }
                  }
                });
                Object.keys(summary).forEach(name => {
                  const s = summary[name];
                  const roleText = s.role === 'parttime' ? 'アルバイト' : (s.role === 'manager' ? '責任者' : '作業員');
                  csv += `${csvField(name)},${roleText},${s.days},${s.hours.toFixed(1)},${s.breakHours.toFixed(1)},${s.actualHours.toFixed(1)},${s.totalPay}\n`;
                });
              } else if (exportType === 'site') {
                // 現場別集計
                csv = '現場名,始業人数,合計人日,従業員一覧\n';
                const siteSummary = {};
                records.forEach(r => {
                  if (!siteSummary[r.jobSiteName]) {
                    siteSummary[r.jobSiteName] = {
                      count: 0,
                      workers: []
                    };
                  }
                  if (r.status === 'completed') {
                    siteSummary[r.jobSiteName].count++;
                    if (!siteSummary[r.jobSiteName].workers.includes(r.employeeName)) {
                      siteSummary[r.jobSiteName].workers.push(r.employeeName);
                    }
                  }
                });
                Object.keys(siteSummary).forEach(site => {
                  const s = siteSummary[site];
                  csv += `${csvField(site)},${s.workers.length},${s.count},${csvField(s.workers.join('、'))}\n`;
                });
              }

              // ダウンロード
              const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = `勤怠_${month}_${exportType}.csv`;
              link.click();
              URL.revokeObjectURL(url);
            });
          }
        }
      }
    };

    // アクセス認証画面を表示
    function showAccessAuth() {
      const isAuthenticated = localStorage.getItem('kintai_access_auth');
      if (isAuthenticated === 'true') {
        initApp();
        return;
      }
      
      document.getElementById('app').innerHTML = `
        <div class="login-container">
          <div class="logo-section">
            <div class="logo">🔐</div>
            <h1 class="app-title">アクセス認証</h1>
            <p class="app-subtitle">勤怠管理システム【東京架設】</p>
          </div>
          <div id="accessError" class="login-error"></div>
          <div class="input-group">
            <label class="input-label">アクセスパスワード</label>
            <input type="password" id="accessPassword" class="login-input" placeholder="パスワードを入力">
          </div>
          <button id="accessBtn" class="login-btn">認証</button>
          <p class="login-hint">※ 関係者以外のアクセスは禁止されています</p>
        </div>
      `;
      
      document.getElementById('accessBtn').addEventListener('click', checkAccessPassword);
      document.getElementById('accessPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkAccessPassword();
      });
    }
    
    function checkAccessPassword() {
      const password = document.getElementById('accessPassword').value;
      const errorDiv = document.getElementById('accessError');
      
      if (password === ACCESS_PASSWORD) {
        localStorage.setItem('kintai_access_auth', 'true');
        initApp();
      } else {
        errorDiv.textContent = 'パスワードが正しくありません';
        errorDiv.classList.add('show');
      }
    }

    // ===========================================================================
    // 【v3.2.0】匿名認証（Firestoreセキュリティルール強化の前提）
    //   Firebase Console で Anonymous 認証を有効化し、Firestoreルールを
    //   `allow read, write: if request.auth != null;` に変更すると、
    //   アプリを経由しない無認証アクセスを遮断できる。
    //   Auth未有効・SDK未読込・失敗時は従来通り動作する（後方互換）。
    // ===========================================================================
    async function ensureAuth(timeoutMs) {
      try {
        if (typeof firebase === 'undefined' || !firebase.auth || !db) return;
        if (firebase.auth().currentUser) return;
        await Promise.race([
          firebase.auth().signInAnonymously().then(function() {
            console.log('[Firebase v3.2] 匿名認証OK');
          }),
          new Promise(function(res) { setTimeout(res, timeoutMs || 4000); })
        ]);
      } catch (e) {
        console.warn('[Firebase v3.2] 匿名認証スキップ（Console未有効の可能性）:', e && e.code ? e.code : e);
      }
    }

    // アプリ起動（Firebase初期化）
    async function initApp() {
      document.getElementById('app').innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;"><div style="font-size:48px;margin-bottom:20px;">⏳</div><div style="color:#94a3b8;">データ同期中...</div></div>';
      
      try {
        // 【v3.2.0】ルールが認証必須の場合に備え、先に匿名認証を確立
        await ensureAuth(4000);
        // 【重要】まずFirebaseからデータを読み込む（Firebaseが正）
        const loaded = await FirebaseSync.loadAllFromFirebase();
        
        if (loaded) {
          console.log('[起動] Firebaseからデータ読み込み完了');
          console.log('[起動] records件数:', App.records.length);
        } else {
          // Firebaseにデータがない場合のみ、LocalStorageから初期化
          // ただし、これは新規インストール時のみ
          console.log('[起動] Firebaseにデータなし - 新規セットアップ');
        }
        
        // プライベート従業員のisPrivate確認（ログのみ、保存しない）
        const privateEmployeeIds = ['10', '11'];
        App.employees.forEach(emp => {
          if (privateEmployeeIds.includes(emp.id) && !emp.isPrivate) {
            console.warn('[警告] isPrivateが未設定:', emp.name);
            // メモリ上では設定するが、即座にFirebaseに保存しない
            emp.isPrivate = true;
          }
        });
        
        // リアルタイム同期開始
        FirebaseSync.startRealtimeSync();
        
        // 自動バックアップ開始（1日1回）
        FirebaseSync.startAutoBackup();
        
        // 日付変更検知（1分ごとにチェック）- 日本時間
        let lastDate = App.getToday();
        setInterval(function() {
          const currentDate = App.getToday();
          if (currentDate !== lastDate) {
            console.log('[日付変更] ' + lastDate + ' → ' + currentDate);
            lastDate = currentDate;
            // selectedDateも更新
            App.selectedDate = currentDate;
            App.selectedSiteDate = currentDate;
            // 現在の画面を再描画
            if (App.currentUser && App.currentView) {
              Views.render(App.currentView);
            }
          }
        }, 60000); // 1分ごと
        
        Views.render('login');
      } catch (error) {
        console.error('[起動] 初期化エラー:', error);
        // エラー時はLocalStorageのキャッシュで動作（読み取り専用モード警告）
        alert('サーバーとの接続に問題があります。一時的にオフラインモードで動作します。');
        Views.render('login');
      }
    }

    // 起動
    showAccessAuth();
  </script>
</body>
