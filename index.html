      siteFinance: function() {
        // 全現場（営業・内勤除外）
        const allSites = App.jobSites.filter(s => 
          s.isActive && !App.EXCLUDED_SITES.some(ex => s.name.includes(ex))
        );
        
        let sitesHtml = '';
        allSites.forEach(site => {
          const statusBadge = site.completedDate 
            ? '<span class="finance-status completed">完工</span>' 
            : (site.scaffoldingDone ? '<span class="finance-status scaffolding">架け済</span>' : '<span class="finance-status active">稼働中</span>');
          
          sitesHtml += `
            <div class="finance-card-link" data-site-id="${site.id}">
              <div class="finance-header">
                <span class="finance-site-name">${esc(site.name)}</span>
                ${statusBadge}
              </div>
              <div class="finance-link-text">タップして詳細を見る →</div>
            </div>
          `;
        });

        return `
          <div class="header">
            <button id="backBtn" class="back-btn">← 戻る</button>
            <span class="header-title">各現場収支</span>
          </div>
          <div class="list-content">
            ${sitesHtml || '<p class="empty-text">現場がありません</p>'}
          </div>
        `;
      },
      
      siteFinanceDetail: function() {
        const site = App.jobSites.find(s => s.id === App.selectedSiteId);
        if (!site) return '<p class="empty-text">現場が見つかりません</p>';
        
        const LABOR_COST_PER_DAY = 25000;
        const TRUCK_COST_PER_UNIT = 25000;
        
        // 勤怠記録から自動人件費を計算
        const allRecords = App.records.filter(r => r.jobSiteName === site.name);
        const autoLaborCost = allRecords.length * LABOR_COST_PER_DAY;
        
        // 日報データから協力会社・トラックを集計
        let dailySubcontract = 0;
        let dailyTruckCount = 0;
        Object.keys(App.siteDailyReports).forEach(key => {
          if (key.endsWith('_' + site.name)) {
            const report = App.siteDailyReports[key];
            dailySubcontract += report.subcontractAmount || 0;
            dailyTruckCount += report.truckCount || 0;
          }
        });
        const dailyTruckCost = dailyTruckCount * TRUCK_COST_PER_UNIT;
        
        // 総計データ
        const totalData = App.getSiteFinance(site.id, 'total', 'all');
        const scaffoldingData = App.getSiteFinance(site.id, 'scaffolding', 'all');
        const completionData = App.getSiteFinance(site.id, 'completion', 'all');
        
        // 材料費データ（月ごと）
        const materialMonths = totalData.materialMonths || [];
        let totalMaterialCost = 0;
        materialMonths.forEach(m => {
          totalMaterialCost += (m.basicCost || 0) + (m.rentalCost || 0);
        });
        
        // 材料費月ごとHTML
        let materialMonthsHtml = '';
        materialMonths.forEach((m, idx) => {
          materialMonthsHtml += `
            <div class="material-month-item">
              <span>${m.month}</span>
              <span>基本¥${(m.basicCost||0).toLocaleString()} 賃貸¥${(m.rentalCost||0).toLocaleString()}</span>
              <button class="material-del-btn" data-idx="${idx}">✕</button>
            </div>
          `;
        });
        
        // 費用計算
        const additionalLabor = totalData.laborCost || 0;
        const additionalSubcontract = totalData.subcontractAmount || 0;
        const additionalTruckCount = totalData.truckCount || 0;
        const additionalTruckCost = additionalTruckCount * TRUCK_COST_PER_UNIT;
        
        const totalContract = totalData.contractAmount || 0;
        const totalCost = autoLaborCost + additionalLabor + dailySubcontract + additionalSubcontract + dailyTruckCost + additionalTruckCost + totalMaterialCost;
        const profit = totalContract - totalCost;
        const profitRate = totalContract > 0 ? ((profit / totalContract) * 100).toFixed(1) : 0;
        const profitClass = profit >= 0 ? 'profit-positive' : 'profit-negative';

        return `
          <div class="header">
            <button id="backBtn" class="back-btn">← 戻る</button>
            <span class="header-title">現場収支</span>
          </div>
          <div class="list-content">
            <div class="finance-top-summary">
              <div class="finance-top-name">${esc(site.name)}</div>
              <div class="finance-top-row">
                <span>収支</span>
                <span class="${profitClass}">${profit >= 0 ? '+' : ''}¥${profit.toLocaleString()}</span>
              </div>
              <div class="finance-top-row">
                <span>収益率</span>
                <span class="${profitClass}">${profitRate}%</span>
              </div>
            </div>
            
            <!-- 総計アコーディオン -->
            <div class="accordion-item open" data-section="total">
              <div class="accordion-header" data-section="total">
                <span>▼ 総計</span>
              </div>
              <div class="accordion-body" id="accordionTotal">
                <div class="acc-row">
                  <label>請負金額</label>
                  <input type="number" id="totalContract" class="acc-input" value="${totalContract}">
                  <span>円</span>
                </div>
                <div class="acc-row display">
                  <span>👷人件費 勤怠(${allRecords.length}人)</span>
                  <span>¥${autoLaborCost.toLocaleString()}</span>
                </div>
                <div class="acc-row">
                  <label>👷追加</label>
                  <input type="number" id="additionalLabor" class="acc-input" value="${additionalLabor}">
                  <span>円</span>
                </div>
                <div class="acc-row display">
                  <span>🏢協力会社 日報分</span>
                  <span>¥${dailySubcontract.toLocaleString()}</span>
                </div>
                <div class="acc-row">
                  <label>🏢追加</label>
                  <input type="number" id="additionalSubcontract" class="acc-input" value="${additionalSubcontract}">
                  <span>円</span>
                </div>
                <div class="acc-row display">
                  <span>🚚トラック 日報(${dailyTruckCount}台)</span>
                  <span>¥${dailyTruckCost.toLocaleString()}</span>
                </div>
                <div class="acc-row">
                  <label>🚚追加</label>
                  <input type="number" id="additionalTruck" class="acc-input" value="${additionalTruckCount}">
                  <span>台</span>
                </div>
                <div class="acc-material-section">
                  <div class="acc-material-header">
                    <span>📦材料費 計¥${totalMaterialCost.toLocaleString()}</span>
                    <button class="acc-add-btn" id="addMaterialMonth">＋</button>
                  </div>
                  <div id="materialMonthsList">
                    ${materialMonthsHtml || '<span class="acc-empty">月を追加してください</span>'}
                  </div>
                </div>
                <button class="acc-save-btn" id="saveTotalBtn">💾 保存</button>
              </div>
            </div>
            
            <!-- 足場架けアコーディオン -->
            <div class="accordion-item" data-section="scaffolding">
              <div class="accordion-header" data-section="scaffolding">
                <span>▶ 足場架け</span>
              </div>
              <div class="accordion-body hidden" id="accordionScaffolding">
                <div class="acc-row">
                  <label>請負金額</label>
                  <input type="number" id="scaffoldingContract" class="acc-input" value="${scaffoldingData.contractAmount || 0}">
                  <span>円</span>
                </div>
                <div class="acc-row">
                  <label>追加人件費</label>
                  <input type="number" id="scaffoldingLabor" class="acc-input" value="${scaffoldingData.laborCost || 0}">
                  <span>円</span>
                </div>
                <button class="acc-save-btn" id="saveScaffoldingBtn">💾 保存</button>
              </div>
            </div>
            
            <!-- 完工アコーディオン -->
            <div class="accordion-item ${!site.completedDate ? 'disabled' : ''}" data-section="completion">
              <div class="accordion-header" data-section="completion">
                <span>▶ 完工${!site.completedDate ? '（未完工）' : ''}</span>
              </div>
              <div class="accordion-body hidden" id="accordionCompletion">
                ${site.completedDate ? `
                  <div class="acc-row">
                    <label>請負金額</label>
                    <input type="number" id="completionContract" class="acc-input" value="${completionData.contractAmount || 0}">
                    <span>円</span>
                  </div>
                  <div class="acc-row">
                    <label>追加人件費</label>
                    <input type="number" id="completionLabor" class="acc-input" value="${completionData.laborCost || 0}">
                    <span>円</span>
                  </div>
                  <button class="acc-save-btn" id="saveCompletionBtn">💾 保存</button>
                ` : '<p class="acc-empty">完工後に入力できます</p>'}
              </div>
            </div>
          </div>
          
          <!-- 材料費追加モーダル -->
          <div id="materialModal" class="site-detail-modal hidden">
            <div class="site-detail-modal-content">
              <button class="site-detail-modal-close" id="closeMaterialModal">✕</button>

      employeeHistory: function() {
        const isAdmin = App.canViewPrivate();
        
        // 従業員リスト（ヘルパー関数を使用）
        const employees = App.getVisibleEmployees(false);
        
        // 選択中の従業員（デフォルトは最初の従業員）
        let selectedEmpId = App.selectedEmployeeForHistory;
        
        // 選択された従業員が表示可能リストにあるか確認
        if (!selectedEmpId || !employees.find(e => e.id === selectedEmpId)) {
          selectedEmpId = employees[0] ? employees[0].id : null;
          App.selectedEmployeeForHistory = selectedEmpId;
        }
        
        const selectedEmp = employees.find(e => e.id === selectedEmpId);
        
        // 選択中の月（デフォルトは今月）
        // 現在の年月を確実に取得（【v3.2.0】JST基準に統一）
        const currentMonth = App.getToday().slice(0, 7);
        const selectedMonth = App.employeeHistoryMonth || currentMonth;
        
        // 従業員セレクトボックス
        let empOptions = '';
        employees.forEach(emp => {
          // 【v3.1.0 ②】worker/parttime は選択月の確認状態をマークで表示（✅完了 / ⏳未完了）
          let mark = '';
          if (emp.role === 'worker' || emp.role === 'parttime') {
            const _k = emp.id + '_' + selectedMonth;
            const _c = (App.monthlyConfirmations && App.monthlyConfirmations[_k]) || null;
            mark = (_c && _c.confirmed) ? '✅ ' : '⏳ ';
          }
          empOptions += `<option value="${emp.id}" ${emp.id === selectedEmpId ? 'selected' : ''}>${mark}${esc(emp.name)}</option>`;
        });
        
        // 月セレクトボックス（過去7年=84ヶ月）
        // 【v3.2.1】JST基準のcurrentMonthを起点に遡る（v3.2.0でnowDate宣言を削除した際の参照消し忘れを修正）
        let monthOptions = '';
        const [_cy, _cm] = currentMonth.split('-').map(Number);
        for (let i = 0; i < 84; i++) {
          const d = new Date(_cy, _cm - 1 - i, 1);
          const m = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          const label = `${d.getFullYear()}年${d.getMonth() + 1}月`;
          monthOptions += `<option value="${m}" ${m === selectedMonth ? 'selected' : ''}>${label}</option>`;
        }
        
        // 選択月の1日〜末日を取得
        const [year, month] = selectedMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();
        const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
        
        // 選択した従業員の記録をマップ化
        const recordMap = {};
        if (selectedEmpId) {
          App.records
            .filter(r => r.employeeId === selectedEmpId && r.workDate.startsWith(selectedMonth))
            .forEach(r => {
              const day = parseInt(r.workDate.split('-')[2]);
              if (!recordMap[day]) recordMap[day] = [];
              recordMap[day].push(r);
            });
        }
        
        // 出勤日数をカウント（日勤・夜勤別）
        let dayShiftDays = 0;
        let nightShiftDays = 0;
        
        // 日付一覧を生成
        let daysHtml = '';
        for (let day = 1; day <= lastDay; day++) {
          const dateObj = new Date(year, month - 1, day);
          const dayOfWeek = dateObj.getDay();
          const weekdayStr = weekdays[dayOfWeek];
          const isSunday = dayOfWeek === 0;
          const isSaturday = dayOfWeek === 6;
          const dateStr = `${month}/${day}（${weekdayStr}）`;
          
          const dayRecords = recordMap[day] || [];
          
          // 休憩時間計算関数
          function getBreakMinutes(workMinutes) {
            if (workMinutes <= 360) return 0;        // 6時間以下: 休憩なし
            if (workMinutes <= 480) return 45;       // 8時間以下: 45分
            return 60;                                // 8時間超: 60分
          }
          
          // 分を「○時間○分」形式に変換
          function formatMinutes(minutes) {
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            if (h > 0 && m > 0) return `${h}時間${m}分`;
            if (h > 0) return `${h}時間`;
            return `${m}分`;
          }
          
          // この日の日付文字列（YYYY-MM-DD）
          const fullDateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          
          let statusHtml = '';
          if (dayRecords.length > 0) {
            // その日に日勤・夜勤があるかチェック（日数カウント用）
            const hasDayShift = dayRecords.some(r => r.shiftType !== 'night');
            const hasNightShift = dayRecords.some(r => r.shiftType === 'night');
            if (hasDayShift) dayShiftDays++;
            if (hasNightShift) nightShiftDays++;
            
            dayRecords.forEach(r => {
              const isNight = r.shiftType === 'night';
              const shiftLabel = isNight ? '<span style="color: #ef4444; font-weight: 600;">夜勤</span>' : '<span style="color: #3b82f6;">日勤</span>';
              const timeStr = App.formatTime(r.clockInTime) + '〜' + (r.clockOutTime ? App.formatTime(r.clockOutTime) : '勤務中');
              let hoursStr = '';
              if (r.workHours) {
                const totalMinutes = Math.round(r.workHours * 60);
                const breakMinutes = getBreakMinutes(totalMinutes);
                const actualMinutes = Math.max(0, totalMinutes - breakMinutes);
                hoursStr = `（実働 ${formatMinutes(actualMinutes)}）`;
              }
              statusHtml += `
                <div class="day-record emp-hist-record" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px;">
                  <div style="flex: 1;">
                    <div class="day-site">${shiftLabel} / ${esc(r.jobSiteName)}</div>
                    <div class="day-time">${timeStr}${hoursStr}</div>
                  </div>
                  <button class="edit-record-btn" data-record-id="${r.id}" style="padding: 6px 12px; background: #3b82f6; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap;">編集</button>
                </div>
              `;
            });
          }
          
          // 追加ボタン（常に表示）
          statusHtml += `
            <button class="add-record-btn" data-date="${fullDateStr}" data-emp-id="${selectedEmpId}" style="padding: 4px 8px; background: #22c55e; color: #fff; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 4px;">＋追加</button>
          `;
          
          daysHtml += `
            <div class="day-row ${isSunday ? 'sunday' : ''} ${isSaturday ? 'saturday' : ''} ${dayRecords.length > 0 ? 'worked' : ''}">
              <div class="day-date">${dateStr}</div>
              <div class="day-status">${statusHtml}</div>
            </div>
          `;
        }
        
        const totalDays = dayShiftDays + nightShiftDays;
        const backView = isAdmin ? 'admin' : 'subadmin';

        // 【v3.1.0 ④】選択中の従業員の、その月の「現場別 出勤日数」を集計
        //   例: 松川さん → A現場5日(日勤4/夜勤1)、B現場3日 …
        //   recordMap は既に「選択従業員・選択月」で絞り込み済みなので、これを現場名で集計する。
        const empSiteAgg = {}; // { 現場名: {total, day, night} }
        Object.keys(recordMap).forEach(function(day) {
          recordMap[day].forEach(function(r) {
            const key = r.jobSiteName || '（現場名なし）';
            if (!empSiteAgg[key]) empSiteAgg[key] = { total: 0, day: 0, night: 0 };
            empSiteAgg[key].total++;
            if (r.shiftType === 'night') empSiteAgg[key].night++;
            else empSiteAgg[key].day++;
          });
        });
        // 日数の多い順に並べる
        const empSiteAggList = Object.keys(empSiteAgg).map(function(name) {
          return { name: name, total: empSiteAgg[name].total, day: empSiteAgg[name].day, night: empSiteAgg[name].night };
        }).sort(function(a, b) { return b.total - a.total; });

        // 現場別集計のHTML
        let empSiteHtml = '';
        if (empSiteAggList.length === 0) {
          empSiteHtml = '<p class="empty-text" style="padding:12px; color:#94a3b8;">この月の出勤記録はありません</p>';
        } else {
          let siteRows = '';
          empSiteAggList.forEach(function(s) {
            siteRows += `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid #1e293b;">
                <div style="flex:1; min-width:0;">
                  <div style="color:#e2e8f0; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🏗️ ${esc(s.name)}</div>
                  <div style="color:#94a3b8; font-size:11px; margin-top:2px;">☀️日勤 ${s.day}日 ／ 🌙夜勤 ${s.night}日</div>
                </div>
                <div style="text-align:right; white-space:nowrap; margin-left:8px;">
                  <span style="color:#5ad0ec; font-size:18px; font-weight:700;">${s.total}</span>
                  <span style="color:#94a3b8; font-size:11px;"> 日</span>
                </div>
              </div>
            `;
          });
          empSiteHtml = `
            <div style="background:#0f172a; border:1px solid #1e293b; border-radius:8px; overflow:hidden;">
              ${siteRows}
              <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:#1e293b;">
                <span style="color:#e2e8f0; font-size:13px; font-weight:700;">合計</span>
                <span style="color:#5ad0ec; font-size:16px; font-weight:700;">${totalDays} 日</span>
              </div>
            </div>
          `;
        }

        // 【v3.1.0 ②】選択中の従業員・月の「確認完了」状態を取得
        //   従業員本人が history 画面で「確認完了」した状態を管理者側に表示する。
        const empHistConfKey = selectedEmpId + '_' + selectedMonth;
        const empHistConf = (App.monthlyConfirmations && App.monthlyConfirmations[empHistConfKey]) || null;
        const empHistIsConfirmed = !!(empHistConf && empHistConf.confirmed);

        // 確認完了バナーHTML（選択中の従業員が worker / parttime のときのみ意味を持つ）
        let confStatusHtml = '';
        {
          const selEmp = employees.find(e => e.id === selectedEmpId);
          const selEmpEditable = selEmp && (selEmp.role === 'worker' || selEmp.role === 'parttime');
          if (selEmpEditable) {
            // 当月5日期限の判定（選択月が前月で、今日が当月6日以降なら期限超過）
            const _now = new Date();
            const _prev = new Date(_now.getFullYear(), _now.getMonth() - 1, 1);
            const _prevStr = _prev.getFullYear() + '-' + String(_prev.getMonth() + 1).padStart(2, '0');
            const isPrevMonthSel = (selectedMonth === _prevStr);
            const overdue = isPrevMonthSel && _now.getDate() > 5 && !empHistIsConfirmed;

            if (empHistIsConfirmed) {
              const cAt = empHistConf.confirmedAt ? new Date(empHistConf.confirmedAt) : null;
              const cAtStr = cAt ? `${cAt.getMonth() + 1}/${cAt.getDate()} ${String(cAt.getHours()).padStart(2,'0')}:${String(cAt.getMinutes()).padStart(2,'0')}` : '';
              confStatusHtml = `
                <div style="background:#dcfce7; border:1px solid #22c55e; border-radius:10px; padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px;">
                  <span style="font-size:20px;">✅</span>
                  <div>
                    <div style="color:#166534; font-weight:700; font-size:14px;">本人の出勤確認：完了</div>
                    <div style="color:#166534; font-size:12px;">確認日時 ${cAtStr}${empHistConf.confirmedBy ? '（' + empHistConf.confirmedBy + '）' : ''}</div>
                  </div>
                </div>
              `;
            } else {
              confStatusHtml = `
                <div style="background:${overdue ? '#fee2e2' : '#fef3c7'}; border:1px solid ${overdue ? '#ef4444' : '#f59e0b'}; border-radius:10px; padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px;">
                  <span style="font-size:20px;">${overdue ? '⚠️' : '⏳'}</span>
                  <div>
                    <div style="color:${overdue ? '#991b1b' : '#92400e'}; font-weight:700; font-size:14px;">本人の出勤確認：未完了${overdue ? '（期限超過）' : ''}</div>
                    <div style="color:${overdue ? '#991b1b' : '#92400e'}; font-size:12px;">${overdue ? '前月分の確認期限（当月5日）を過ぎています' : 'この従業員はまだ確認を完了していません'}</div>
                  </div>
                </div>
              `;
            }
          }
        }

        return `
          <div class="header">
            <button id="backBtn" class="back-btn" data-view="${backView}">← 戻る</button>
            <span class="header-title">従業員出勤履歴</span>
          </div>
          <div class="list-content">
            <div class="filter-section" style="display: flex; gap: 12px; margin-bottom: 16px;">
              <select id="empHistorySelect" class="month-select" style="flex: 1;">
                ${empOptions}
              </select>
              <select id="empHistoryMonthSelect" class="month-select" style="flex: 1;">
                ${monthOptions}
              </select>
            </div>
            ${confStatusHtml}
            <div class="month-summary">
              <div class="month-summary-item">
                <span class="month-summary-label">☀️ 日勤</span>
                <span class="month-summary-value">${dayShiftDays}日</span>
              </div>
              <div class="month-summary-item">
                <span class="month-summary-label">🌙 夜勤</span>
                <span class="month-summary-value">${nightShiftDays}日</span>
              </div>
              <div class="month-summary-item">
                <span class="month-summary-label">合計</span>
                <span class="month-summary-value">${totalDays}日</span>
              </div>
            </div>
            <!-- 【v3.1.0 ④】選択中の従業員の 現場別 出勤日数 -->
            <div style="margin-bottom:16px;">
              <div style="color:#94a3b8; font-size:13px; font-weight:600; margin-bottom:8px;">🏗️ 現場別 出勤日数</div>
              ${empSiteHtml}
            </div>
            <div class="days-list" id="empHistoryDaysList">
              ${daysHtml}
            </div>
          </div>
        `;
      },

      correctionList: function() {
        const corrections = App.corrections.sort((a, b) => {
          if (a.status === 'pending' && b.status !== 'pending') return -1;
          if (a.status !== 'pending' && b.status === 'pending') return 1;
          return new Date(b.createdAt) - new Date(a.createdAt);
        });

        let correctionsHtml = '';
        if (corrections.length === 0) {
          correctionsHtml = '<p class="empty-text">修正依頼はありません</p>';
        } else {
          corrections.forEach(c => {
            const statusClass = c.status === 'pending' ? 'pending' : (c.status === 'approved' ? 'approved' : 'rejected');
            const statusText = c.status === 'pending' ? '未処理' : (c.status === 'approved' ? '承認済' : '却下');
            
            // 新形式（timeCorrection）か旧形式かで表示を分ける
            let detailHtml = '';
            if (c.type === 'timeCorrection') {
              // 新形式：申請内容を表示
              const startTime = String(c.startHour).padStart(2,'0') + ':' + String(c.startMin).padStart(2,'0');
              const endTime = c.endHour !== null ? String(c.endHour).padStart(2,'0') + ':' + String(c.endMin).padStart(2,'0') : '未設定';
              detailHtml = `
                <p class="correction-date">📅 ${App.formatDate(c.workDate)}</p>
                <p class="correction-detail">
                  <strong>申請内容:</strong><br>
                  現場: ${esc(c.jobSiteName || '不明')}<br>
                  始業: ${startTime}<br>
                  終業: ${endTime}
                </p>
                ${c.comment ? `<p class="correction-reason">📝 ${esc(c.comment)}</p>` : ''}
              `;
            } else {
              // 旧形式：既存の記録を参照
              const record = App.records.find(r => r.id === c.recordId);
              detailHtml = `
                <p class="correction-date">📅 ${App.formatDate(c.recordDate)}</p>
                <p class="correction-detail">
                  現場: ${record ? esc(record.jobSiteName) : '不明'}<br>
                  記録: ${record ? App.formatTime(record.clockInTime) + ' 〜 ' + App.formatTime(record.clockOutTime) : '不明'}
                </p>
                <p class="correction-reason">📝 ${esc(c.reason)}</p>
              `;
            }
            
            // ボタンの表示を新旧で分ける
            let buttonsHtml = '';
            if (c.status === 'pending') {
              if (c.type === 'timeCorrection') {
                // 新形式：承認で記録追加、却下で取り下げ
                buttonsHtml = `
                  <div class="correction-actions">
                    <button class="approve-btn" data-correction="${c.id}">承認（記録追加）</button>
                    <button class="reject-btn" data-correction="${c.id}">却下（取り下げ）</button>
                  </div>
                `;
              } else {
                // 旧形式：承認で記録削除
                buttonsHtml = `
                  <div class="correction-actions">
                    <button class="approve-btn" data-correction="${c.id}">承認（記録削除）</button>
                    <button class="reject-btn" data-correction="${c.id}">却下</button>
                  </div>
                `;
              }
            }
            
            correctionsHtml += `
              <div class="correction-card ${statusClass}">
                <div class="correction-header">
                  <span class="correction-employee">${esc(c.employeeName)}</span>
                  <span class="correction-status ${statusClass}">${statusText}</span>
                </div>
                ${detailHtml}
                <p class="correction-time">依頼日時: ${new Date(c.createdAt).toLocaleString('ja-JP')}</p>
                ${buttonsHtml}
              </div>
            `;
          });
        }

        return `
          <div class="header">
            <button id="backBtn" class="back-btn">← 戻る</button>
            <span class="header-title">出退勤誤入力編集依頼</span>
          </div>
          <div class="list-content">
            ${correctionsHtml}
          </div>
        `;
      },

      overtimeRequestList: function() {
        const requests = App.overtimeRequests || [];

        if (requests.length === 0) {
          requestsHtml = '<p class="empty-text">残業申請はありません</p>';
        } else {
          // 申請中を先に、承認済み・却下を後に
          const sorted = [...requests].sort((a, b) => {
            if (a.status === 'pending' && b.status !== 'pending') return -1;
            if (a.status !== 'pending' && b.status === 'pending') return 1;
            return new Date(b.createdAt) - new Date(a.createdAt);
          });
          
          sorted.forEach(req => {
            const statusText = req.status === 'pending' ? '申請中' : req.status === 'approved' ? '承認済み' : '却下';
            const statusClass = req.status === 'pending' ? 'pending' : req.status === 'approved' ? 'approved' : 'rejected';
            requestsHtml += `
              <div class="overtime-request-card ${statusClass}">
                <div class="overtime-request-header">
                  <span class="overtime-request-employee">${esc(req.employeeName)}</span>
                  <span class="overtime-request-status ${statusClass}">${statusText}</span>

                <div class="overtime-request-detail">
                  <span class="overtime-request-date">対象日: ${req.workDate}</span>
                  <span class="overtime-request-hours">残業時間: ${req.hours}時間</span>
                </div>
                <p class="overtime-request-created">申請日: ${new Date(req.createdAt).toLocaleDateString('ja-JP')}</p>
                ${req.status === 'pending' ? `
                  <div class="overtime-request-actions">
                    <button class="approve-overtime-btn" data-request="${req.id}">✓ 承認</button>
                    <button class="reject-overtime-btn" data-request="${req.id}">✗ 却下</button>

                `}

        // 管理者から残業を直接追加

        return `

            <button id="backBtn" class="back-btn">← 戻る</button>
            <span class="header-title">残業申請管理</span>

                <select id="overtimeHoursAdd" class="form-select">
                  <option value="1">1時間</option>
                  <option value="2">2時間</option>
                  <option value="3">3時間</option>
                  <option value="4">4時間</option>
                  <option value="5">5時間</option>
                </select>
                <button id="addOvertimeDirectBtn" class="form-btn">追加</button>
              </div>
            </div>
            
            <h3 class="form-title" style="margin-top: 24px;">📋 申請一覧</h3>

      dataManagement: function() {
        // 勤怠記録の件数
        const recordCount = App.records.length;

        const siteCount = App.jobSites.length;

        oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);

        const oldRecordCount = App.records.filter(r => r.workDate < oneYearAgoStr).length;
        
        // 6ヶ月以上前
        const sixMonthsAgo = new Date();
        sixMonthsAgo.setMonth(sixMonthsAgo.getMonth() - 6);

                  <span>勤怠記録</span>
                  <span>${recordCount}件</span>
                </div>
                <div class="cleanup-stat-row">
                  <span>現場</span>
                  <span>${siteCount}件（終了: ${completedSiteCount}件）</span>
                </div>
                <div class="cleanup-stat-row">
                  <span>修正依頼</span>
                  <span>${correctionCount}件</span>

                <div class="cleanup-stat-row">
                  <span>住所変更届</span>

            <div class="cleanup-section">

                ${App.jobSites.map(site => {
                  const recordsForSite = App.records.filter(r => r.jobSiteName === site.name).length;
                  const status = site.completedDate ? '終了' : (site.scaffoldingDone ? '架け済' : '稼働中');

                    <div class="site-delete-item">
                      <label class="site-delete-checkbox">

                        <span class="site-delete-name">${esc(site.name)}</span>

              <button class="cleanup-btn delete-selected-sites" id="deleteSelectedSites">選択した現場を削除</button>

            <div class="cleanup-section">

              <div class="cleanup-option">
                <div class="cleanup-option-info">

                  <span class="cleanup-option-count">${oldRecordCount6m}件</span>
                </div>
                <button class="cleanup-btn" id="deleteOldRecords6m" ${oldRecordCount6m === 0 ? 'disabled' : ''}>削除</button>

              <div class="cleanup-option">
                <div class="cleanup-option-info">
                  <span class="cleanup-option-title">1年以上前の勤怠記録</span>
                  <span class="cleanup-option-count">${oldRecordCount}件</span>
                </div>
                <button class="cleanup-btn" id="deleteOldRecords1y" ${oldRecordCount === 0 ? 'disabled' : ''}>削除</button>
              </div>
              
              <div class="cleanup-option">
                <div class="cleanup-option-info">
                  <span class="cleanup-option-title">終了した現場</span>
                  <span class="cleanup-option-count">${completedSiteCount}件</span>
                </div>
                <button class="cleanup-btn" id="deleteCompletedSites" ${completedSiteCount === 0 ? 'disabled' : ''}>削除</button>

              <div class="cleanup-option">
                <div class="cleanup-option-info">
                  <span class="cleanup-option-title">処理済み修正依頼</span>

              <div class="cleanup-option">

      // イベントバインド
      bindEvents: function(view) {
        const self = this;

        // 共通イベント
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', function() {
            App.currentUser = null;
            self.render('login');
          });
        }

        const backBtn = document.getElementById('backBtn');
        if (backBtn) {
          backBtn.addEventListener('click', function() {
            // siteFinanceDetailからはsiteFinanceに戻る
            if (view === 'siteFinanceDetail') {
              self.render('siteFinance');

          // 追加ボタン

              // モーダルHTML

          // 編集ボタン - 選択式モーダルを表示
          const editBtns = document.querySelectorAll('.edit-record-btn');
          editBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
              const recordId = this.getAttribute('data-record-id');
              const record = App.records.find(r => r.id === recordId);
              if (!record) {
                alert('記録が見つかりません');
                return;
              }
              
              // 現在の時刻を取得
              const clockInDate = record.clockInTime ? new Date(record.clockInTime) : null;
              const clockOutDate = record.clockOutTime ? new Date(record.clockOutTime) : null;
              const currentStartHour = clockInDate ? clockInDate.getHours() : 8;
              const currentStartMin = clockInDate ? Math.floor(clockInDate.getMinutes() / 15) * 15 : 0;
              const currentEndHour = clockOutDate ? clockOutDate.getHours() : '';
              const currentEndMin = clockOutDate ? Math.floor(clockOutDate.getMinutes() / 15) * 15 : '';
              const currentOvertime = record.overtimeHours || 0;
              
              // 時間オプション生成
              let hourOptions = '';
              for (let h = 0; h < 24; h++) {
                const hStr = String(h).padStart(2, '0');
                const selected = h === currentStartHour ? 'selected' : '';
                hourOptions += `<option value="${h}" ${selected}>${hStr}</option>`;
              }
              let minOptions = '';
              [0, 15, 30, 45].forEach(m => {
                const mStr = String(m).padStart(2, '0');
                const selected = m === currentStartMin ? 'selected' : '';
                minOptions += `<option value="${m}" ${selected}>${mStr}</option>`;
              });
              
              // 終業時刻オプション（現在の値をselected）
              let endHourOptions = '<option value="">--</option>';
              for (let h = 0; h < 24; h++) {

                const mStr = String(m).padStart(2, '0');
                const selected = m === currentEndMin ? 'selected' : '';
                endMinOptions += `<option value="${m}" ${selected}>${mStr}</option>`;

              let siteOptions = '';
              App.jobSites.filter(s => s.isActive).forEach(site => {
                const selected = site.id === record.jobSiteId ? 'selected' : '';
                siteOptions += `<option value="${site.id}" ${selected}>${esc(site.name)}</option>`;

              // 残業オプション生成
              let overtimeOptions = '';
              for (let ot = 0; ot <= 10; ot++) {
                const selected = ot === currentOvertime ? 'selected' : '';
                overtimeOptions += `<option value="${ot}" ${selected}>${ot}時間</option>`;
              }
              
              // 日勤/夜勤
              const isNight = record.shiftType === 'night';
              
              // モーダルHTML
              const modalHtml = `
                <div class="modal-overlay" id="editRecordModal">
                  <div class="modal-content">
                    <div class="modal-title">📝 勤怠記録を編集</div>
                    <div class="modal-info">

                        <span class="modal-info-value">${esc(record.employeeName)}</span>

                      </select>

                    <div class="modal-form-group">
                      <label class="modal-label">始業時刻</label>

                        <span>:</span>
                        <select id="editStartMin" class="modal-select">${minOptions}</select>

                    <div class="modal-form-group">

                        <span>:</span>
                        <select id="editEndMin" class="modal-select">${endMinOptions}</select>
                      </div>

                    <div class="modal-form-group">
                      <label class="modal-label">残業時間</label>
                      <select id="editOvertime" class="modal-select">${overtimeOptions}</select>

                    <div class="modal-buttons">

                    <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #475569;">
                      <button class="modal-btn modal-btn-danger" id="editRecordDelete" style="width: 100%;">🗑️ この記録を削除</button>
                    </div>
                  </div>
                </div>
              `;
              
              document.body.insertAdjacentHTML('beforeend', modalHtml);
              
              // キャンセルボタン
              document.getElementById('editRecordCancel').addEventListener('click', function() {
                document.getElementById('editRecordModal').remove();
              });
              
              // 保存ボタン
              document.getElementById('editRecordSave').addEventListener('click', function() {
                const siteId = document.getElementById('editSiteSelect').value;
                const shiftType = document.getElementById('editShiftType').value;
                const startHour = document.getElementById('editStartHour').value;
                const startMin = document.getElementById('editStartMin').value;

                const overtime = parseInt(document.getElementById('editOvertime').value);
                
                const site = App.jobSites.find(s => s.id === siteId);
                
                // 現場更新
                if (site) {
                  record.jobSiteId = site.id;
                  record.jobSiteName = site.name;

                // シフト更新
                record.shiftType = shiftType;
                
                // 始業時刻更新
                if (startHour !== '') {
                  const newClockIn = new Date(record.clockInTime || record.workDate + 'T00:00:00');

                  record.clockInTime = newClockIn.toISOString();

                // 終業時刻更新
                if (endHour !== '' && endMin !== '') {
                  let newClockOut;
                  if (record.clockOutTime) {
                    newClockOut = new Date(record.clockOutTime);

                    newClockOut = new Date(record.clockInTime);

                  newClockOut.setHours(parseInt(endHour), parseInt(endMin), 0, 0);

                  if (newClockOut <= new Date(record.clockInTime)) {
                    newClockOut.setDate(newClockOut.getDate() + 1);

                  record.status = 'completed';
                  
                  // 勤務時間を計算

              document.getElementById('editRecordDelete').addEventListener('click', async function() {

        // 始業打刻

          const confirmBtn = document.getElementById('confirmClockIn');

          // 入力状態をチェックする関数
          function checkInput() {
            const hasSelect = jobSiteSelect.value !== '';
            const hasCustom = customJobSite.value.trim() !== '';
            confirmBtn.disabled = !hasSelect && !hasCustom;
          }

          if (jobSiteSelect) {
            jobSiteSelect.addEventListener('change', function() {
              // 既存現場を選んだら、新規入力欄をクリア
              if (this.value) {
                customJobSite.value = '';
              }
              checkInput();
            });
          }

          if (customJobSite) {
            customJobSite.addEventListener('input', function() {
              // 新規入力したら、選択をリセット
              if (this.value.trim()) {
                jobSiteSelect.value = '';
              }
              checkInput();
            });
          }

          if (confirmBtn) {
            confirmBtn.addEventListener('click', async function() {
              // 【v3.0.0】二重クリック防止
              if (this.disabled) return;
              
              let siteId = jobSiteSelect.value;
              let siteName = '';
              
              // 新規入力があればそちらを優先
              if (customJobSite.value.trim()) {
                let inputName = customJobSite.value.trim();
                
                // 類似現場名をチェック（漢字5文字以上一致）
                const similarSite = App.findSimilarSite(inputName);
                
                if (similarSite) {
                  alert("類似現場: " + similarSite);
                  if (confirm(`「${similarSite}」の現場ではありませんか？\n\n[OK] → 「${similarSite}」を使用（収支データも統合）\n[キャンセル] → 「${inputName}」で新規登録`)) {
                    siteName = similarSite;
                  } else {
                    siteName = inputName;
                  }
                } else {
                  siteName = inputName;
                }
                
                // 同じ名前の現場が既にあるかチェック
                const existingSite = App.jobSites.find(s => s.name === siteName);
                if (existingSite) {
                  siteId = existingSite.id;
                  
                  // 類似現場が選ばれた場合、収支データを統合
                  if (similarSite && siteName === similarSite) {
                    // 入力された名前で登録されていた収支データがあれば、類似現場に統合
                    if (App.siteFinanceData && App.siteFinanceData[inputName]) {
                      const oldData = App.siteFinanceData[inputName];
                      if (!App.siteFinanceData[siteName]) {
                        App.siteFinanceData[siteName] = oldData;
                      }
                      delete App.siteFinanceData[inputName];
                    }
                  }
                } else {
                  // 新しい現場をマスタに自動追加
                  const newSite = {
                    id: Date.now().toString(),
                    name: siteName,
                    address: '',
                    isActive: true,
                    addedBy: App.currentUser.name,
                    addedAt: new Date().toISOString()
                  };
                  App.jobSites.push(newSite);
                  siteId = newSite.id;
                }
              } else if (siteId) {
                const site = App.jobSites.find(s => s.id === siteId);
                siteName = site ? site.name : '';
              }

              if (!siteName) {
                alert('現場を選択または入力してください');
                return;
              }

              // 【v3.0.0】二重クリック防止: ここから保存処理
              this.disabled = true;
              const originalText = this.textContent;
              this.textContent = '保存中...';

              // 夜勤判定（17時〜翌5時の出勤は夜勤）【v3.2.0】端末TZに依存しないJST時刻で判定
              const clockInHour = App.getJstHour();
              const shiftType = (clockInHour >= 17 || clockInHour < 5) ? 'night' : 'day';

              const newRecord = {
                id: Date.now().toString(),
                employeeId: App.currentUser.id,
                employeeName: App.currentUser.name,
                jobSiteId: siteId,
                jobSiteName: siteName,
                workDate: App.getToday(),
                clockInTime: new Date().toISOString(),
                clockOutTime: null,
                shiftType: shiftType,
                memo: '',
                status: 'working',
                updatedAt: new Date().toISOString()
              };

              App.records.push(newRecord);

              // 【v3.0.0】保存成功を確認してからアラート表示
              try {
                Storage.set('records', App.records);
                const saved = await FirebaseSync.saveAllToFirebase();
                if (!saved) {
                  // 保存失敗 → ロールバック
                  App.records = App.records.filter(r => r.id !== newRecord.id);
                  Storage.set('records', App.records);
                  alert('⚠️ 保存に失敗しました。\n\n通信状態を確認して、もう一度「始業を確定」を押してください。\n（申請からは出さないでください。重複の原因になります）');
                  this.disabled = false;
                  this.textContent = originalText;
                  return;
                }
              } catch (e) {
                // エラー → ロールバック
                App.records = App.records.filter(r => r.id !== newRecord.id);
                Storage.set('records', App.records);
                alert('⚠️ エラーが発生しました：\n' + (e.message || e) + '\n\nもう一度お試しください。');
                this.disabled = false;
                this.textContent = originalText;
                return;
              }

              alert('✅ 始業を記録しました！' + (shiftType === 'night' ? '（🌙夜勤）' : '（☀️日勤）'));
              // 役割に応じた画面に戻る
              if (App.currentUser.role === 'admin') {
                self.render('admin');
              } else if (App.currentUser.role === 'subadmin') {
                self.render('subadmin');
              } else {
                self.render('home');
              }
            });
          }

              // 【v3.0.0】二重クリック防止
              if (this.disabled) return;
              this.disabled = true;
              const originalText = this.textContent;
              this.textContent = '保存中...';
              
              const record = App.getWorkingRecord();
              if (!record) {
                this.disabled = false;
                this.textContent = originalText;
                return;
              }

              const today = App.getToday();
              const isPastRecord = record.workDate < today;
              const clockInTime = new Date(record.clockInTime);
              let clockOutTime;
              
              // 日勤で日付をまたいでいる場合は17:00に強制
              if (isPastRecord && record.shiftType === 'day') {
                // 出勤日の17:00で退勤
                clockOutTime = new Date(record.workDate + 'T17:00:00+09:00'); // 【v3.2.0】JST明示
                console.log('[退勤] 日勤の日付またぎ → ' + record.workDate + ' 17:00 で処理');
              } else {
                // 通常の退勤（現在時刻）
                clockOutTime = new Date();
              }
              
              const workHours = (clockOutTime - clockInTime) / (1000 * 60 * 60);

              // 【v3.0.0】エラー時の復元用に元の状態を記憶
              const originalRecord = JSON.parse(JSON.stringify(record));

              record.clockOutTime = clockOutTime.toISOString();
              record.workHours = Math.round(workHours * 100) / 100;
              record.overtimeHours = Math.max(0, Math.round((workHours - 8) * 100) / 100);
              record.memo = workMemo ? workMemo.value : '';
              record.status = 'completed';
              record.updatedAt = new Date().toISOString();
              
              // アルバイトの場合、その時点の時給を記録に保存
              if (App.currentUser.role === 'parttime') {
                record.hourlyRate = App.currentUser.hourlyRate || 1200;
              }

              // 【v3.0.0】保存成功を確認してからアラート表示
              try {
                Storage.set('records', App.records);
                const saved = await FirebaseSync.saveAllToFirebase();
                if (!saved) {
                  // 保存失敗 → ロールバック
                  const idx = App.records.findIndex(r => r.id === originalRecord.id);
                  if (idx !== -1) App.records[idx] = originalRecord;
                  Storage.set('records', App.records);
                  alert('⚠️ 保存に失敗しました。\n\n通信状態を確認して、もう一度「終業を確定」を押してください。\n（申請からは出さないでください。重複の原因になります）');
                  this.disabled = false;
                  this.textContent = originalText;
                  return;
                }

                // エラー → ロールバック
                const idx = App.records.findIndex(r => r.id === originalRecord.id);
                if (idx !== -1) App.records[idx] = originalRecord;
                Storage.set('records', App.records);
                alert('⚠️ エラーが発生しました：\n' + (e.message || e) + '\n\nもう一度お試しください。');
                this.disabled = false;
                this.textContent = originalText;
                return;
              }
              
              if (isPastRecord && record.shiftType === 'day') {
                alert('✅ ' + record.workDate + ' の終業を記録しました。\nお疲れさまでした！');
              } else {

              App.jobSites.filter(s => s.isActive).forEach(site => {
                siteOptions += `<option value="${site.id}">${esc(site.name)}</option>`;
              });
              
              // 時間オプションを生成
              let hourOptions = '';
              for (let h = 0; h < 24; h++) {
                const hStr = String(h).padStart(2, '0');
                const selected = h === 8 ? 'selected' : '';
                hourOptions += `<option value="${h}" ${selected}>${hStr}</option>`;
              }
              let minOptions = '';
              [0, 15, 30, 45].forEach(m => {
                const mStr = String(m).padStart(2, '0');
                const selected = m === 0 ? 'selected' : '';
                minOptions += `<option value="${m}" ${selected}>${mStr}</option>`;
              });
              
              // モーダルHTML
              const modalHtml = `
                <div class="modal-overlay" id="addAttendanceModal">
                  <div class="modal-content">
                    <div class="modal-title">📝 出勤記録を追加</div>
                    <div class="modal-info">
                      <div class="modal-info-row">
                        <span class="modal-info-label">対象日</span>
                        <span class="modal-info-value">${App.formatDate(workDate)}</span>
                      </div>
                    </div>
                    
                    <div class="modal-form-group">
                      <label class="modal-label">従業員</label>
                      <select id="addEmpSelect" class="modal-select">${empOptions}</select>
                    </div>
                    
                    <div class="modal-form-group">
                      <label class="modal-label">現場</label>
                      <select id="addSiteSelect" class="modal-select">${siteOptions}</select>
                    </div>
                    
                    <div class="modal-form-group">
                      <label class="modal-label">始業時刻</label>
                      <div class="modal-time-row">
                        <select id="addStartHour" class="modal-select">${hourOptions}</select>
                        <span>:</span>
                        <select id="addStartMin" class="modal-select">${minOptions}</select>
                      </div>
                    </div>
                    
                    <div class="modal-form-group">
                      <label class="modal-label">終業時刻（任意）</label>
                      <div class="modal-time-row">
                        <select id="addEndHour" class="modal-select">
                          <option value="">--</option>
                          ${hourOptions.replace('selected', '').replace(' selected', '')}
                        </select>
                        <span>:</span>
                        <select id="addEndMin" class="modal-select">
                          <option value="">--</option>
                          ${minOptions.replace('selected', '').replace(' selected', '')}
                        </select>
                      </div>
                    </div>
                    
                    <div class="modal-form-group">
                      <label class="modal-label">日勤 / 夜勤</label>
                      <select id="addShiftType" class="modal-select">
                        <option value="day">☀️ 日勤</option>
                        <option value="night">🌙 夜勤</option>
                      </select>
                    </div>
                    
                    <div class="modal-buttons">
                      <button class="modal-btn modal-btn-cancel" id="addAttendanceCancel">キャンセル</button>
                      <button class="modal-btn modal-btn-success" id="addAttendanceSubmit">追加する</button>
                    </div>
                  </div>
                </div>
              `;
              
              document.body.insertAdjacentHTML('beforeend', modalHtml);
              
              // キャンセルボタン
              document.getElementById('addAttendanceCancel').addEventListener('click', function() {
                document.getElementById('addAttendanceModal').remove();
              });
              
              // 追加ボタン
              document.getElementById('addAttendanceSubmit').addEventListener('click', function() {
                const empId = document.getElementById('addEmpSelect').value;
                const siteId = document.getElementById('addSiteSelect').value;
                const startHour = document.getElementById('addStartHour').value;
                const startMin = document.getElementById('addStartMin').value;
                const endHour = document.getElementById('addEndHour').value;
                const endMin = document.getElementById('addEndMin').value;
                const shiftType = document.getElementById('addShiftType').value;
                
                if (!empId || !siteId || startHour === '') {
                  alert('従業員、現場、始業時刻は必須です');
                  return;
                }
                
                const emp = App.employees.find(e => e.id === empId);
                const site = App.jobSites.find(s => s.id === siteId);
                
                // 始業時刻を作成（【v3.2.0】JST明示で端末TZ非依存に）
                const clockInDate = App.jstDateTime(workDate, parseInt(startHour), parseInt(startMin));
                
                // 終業時刻を作成
                let clockOutDate = null;
                let workHours = null;
                let status = 'working';
                
                if (endHour !== '' && endMin !== '') {
                  clockOutDate = App.jstDateTime(workDate, parseInt(endHour), parseInt(endMin));
                  if (clockOutDate <= clockInDate) {
                    clockOutDate = new Date(clockOutDate.getTime() + 24 * 60 * 60 * 1000);
                  }
                  workHours = (clockOutDate - clockInDate) / (1000 * 60 * 60);
                  workHours = Math.round(workHours * 100) / 100;
                  status = 'completed';
                }
                
                // 新しい記録を作成
                const newRecord = {
                  id: Date.now().toString(),
                  employeeId: emp.id,
                  employeeName: emp.name,
                  jobSiteId: site.id,
                  jobSiteName: site.name,
                  workDate: workDate,
                  clockInTime: clockInDate.toISOString(),
                  clockOutTime: clockOutDate ? clockOutDate.toISOString() : null,
                  shiftType: shiftType,
                  workHours: workHours,
                  status: status,
                  memo: '',
                  addedBy: App.currentUser.name,
                  addedAt: new Date().toISOString()
                };
                
                App.records.push(newRecord);
                App.save();
                document.getElementById('addAttendanceModal').remove();
                alert('出勤記録を追加しました');
                self.render('dailyList');
              });
            });
          }

          // マーク（◯）のクリックで詳細表示
          let modalMap = null;
          document.querySelectorAll('.attendance-mark-item').forEach(function(markItem) {
            markItem.addEventListener('click', function(e) {
              e.stopPropagation();
              const recordId = this.getAttribute('data-record-id');
              const record = App.records.find(r => r.id === recordId);
              if (!record) return;

              const hasGps = record.clockInLat && record.clockInLng;
              const shiftLabel = record.shiftType === 'night' ? '🌙 夜勤' : '☀️ 日勤';
              const statusLabel = record.status === 'completed' ? '終業' : '勤務中';
              const overtimeHours = record.overtimeHours || 0;
              
              const detailHtml = `
                <h3 class="attendance-detail-name">${esc(record.employeeName)}</h3>
                <div class="attendance-detail-row">
                  <span class="attendance-detail-label">状態</span>
                  <span class="attendance-detail-value" style="color: ${record.status === 'completed' ? '#f59e0b' : '#10b981'}">${statusLabel}</span>
                </div>
                <div class="attendance-detail-row">
                  <span class="attendance-detail-label">現場</span>
                  <span class="attendance-detail-value">${esc(record.jobSiteName)}</span>
                </div>
                <div class="attendance-detail-row">
                  <span class="attendance-detail-label">区分</span>
                  <span class="attendance-detail-value">${shiftLabel}</span>
                </div>
                <div class="attendance-detail-row">
                  <span class="attendance-detail-label">始業</span>
                  <span class="attendance-detail-value">${App.formatTime(record.clockInTime)}</span>
                </div>
                <div class="attendance-detail-row">
                  <span class="attendance-detail-label">終業</span>
                  <span class="attendance-detail-value">${record.clockOutTime ? App.formatTime(record.clockOutTime) : '−'}</span>
                </div>
                ${record.workHours ? `
                <div class="attendance-detail-row">
                  <span class="attendance-detail-label">勤務時間</span>
                  <span class="attendance-detail-value">${record.workHours.toFixed(1)}時間</span>
                </div>
                ` : ''}
                <div class="attendance-detail-row">
                  <span class="attendance-detail-label">残業</span>
                  <span class="attendance-detail-value" style="color: ${overtimeHours > 0 ? '#f59e0b' : '#64748b'}">${overtimeHours}時間</span>
                </div>
                <button class="attendance-detail-map-btn" id="showMapFromDetail" 
                  data-lat="${record.clockInLat || ''}" 
                  data-lng="${record.clockInLng || ''}"
                  data-name="${esc(record.employeeName)}"
                  data-site="${esc(record.jobSiteName)}"
                  data-time="${App.formatTime(record.clockInTime)}"
                  ${!hasGps ? 'disabled' : ''}>
                  📍 ${hasGps ? '打刻場所を地図で見る' : '位置情報なし'}
                </button>
                ${(App.currentUser.role === 'admin' || App.currentUser.role === 'subadmin') ? `
                <button class="attendance-detail-edit-btn" id="editOvertimeBtn" data-record-id="${record.id}" style="width: 100%; padding: 12px; margin-top: 8px; background: #f59e0b; border: none; border-radius: 8px; color: #000; font-weight: 600; cursor: pointer;">
                  ⏰ 残業時間を編集
                </button>
                <button class="attendance-detail-delete-btn" id="deleteRecordBtn" data-record-id="${record.id}">
                  🗑️ この記録を削除
                </button>
                ` : ''}
              `;
              
              document.getElementById('attendanceDetailBody').innerHTML = detailHtml;
              document.getElementById('attendanceDetailModal').classList.remove('hidden');
              
              // 残業時間編集ボタン
              const editOvertimeBtn = document.getElementById('editOvertimeBtn');
              if (editOvertimeBtn) {
                editOvertimeBtn.addEventListener('click', function() {
                  const recId = this.getAttribute('data-record-id');
                  const rec = App.records.find(r => r.id === recId);
                  if (!rec) return;
                  
                  const currentOT = rec.overtimeHours || 0;
                  const newOT = prompt(
                    `【${rec.employeeName}】${rec.workDate}\n` +
                    `現在の残業時間: ${currentOT}時間\n\n` +
                    `新しい残業時間を入力してください（0〜10時間）:`,
                    currentOT.toString()
                  );
                  
                  if (newOT === null) return;
                  
                  const otHours = parseInt(newOT);
                  if (isNaN(otHours) || otHours < 0 || otHours > 10) {
                    alert('0〜10の数値を入力してください');
                    return;
                  }
                  
                  rec.overtimeHours = otHours;
                  App.save();
                  document.getElementById('attendanceDetailModal').classList.add('hidden');
                  alert(`残業時間を${otHours}時間に更新しました`);
                  self.render('dailyList');
                });
              }

              // 削除ボタン
              const deleteBtn = document.getElementById('deleteRecordBtn');
              if (deleteBtn) {
                deleteBtn.addEventListener('click', async function() {
                  const recId = this.getAttribute('data-record-id');
                  const rec = App.records.find(r => r.id === recId);
                  if (!rec) return;
                  
                  if (!confirm('この記録を削除しますか？\n\n' + rec.employeeName + '\n' + App.formatDate(rec.workDate) + ' ' + App.formatTime(rec.clockInTime) + '〜\n現場: ' + rec.jobSiteName + '\n\nこの操作は取り消せません。')) {
                    return;
                  }
                  
                  // 【v3.0.0】二重クリック防止
                  if (this.disabled) return;
                  this.disabled = true;
                  const originalText = this.textContent;
                  this.textContent = '削除中...';
                  
                  // 【v3.0.0】FirebaseSync.deleteOneRecord でトランザクション削除
                  // （旧コードは App.save() のマージ方式で削除が反映されないバグがあった）
                  const success = await FirebaseSync.deleteOneRecord(recId);
                  
                  if (!success) {
                    this.disabled = false;
                    this.textContent = originalText;
                    return;
                  }
                  
                  document.getElementById('attendanceDetailModal').classList.add('hidden');
                  alert('記録を削除しました');
                  self.render('dailyList');
                });
              }

              // 地図ボタン
              const mapBtn = document.getElementById('showMapFromDetail');
              if (mapBtn && hasGps) {
                mapBtn.addEventListener('click', function() {
                  const lat = parseFloat(this.getAttribute('data-lat'));
                  const lng = parseFloat(this.getAttribute('data-lng'));
                  const name = this.getAttribute('data-name');
                  const site = this.getAttribute('data-site');
                  const time = this.getAttribute('data-time');

                  document.getElementById('attendanceDetailModal').classList.add('hidden');
                  
                  const modal = document.getElementById('mapModal');
                  const title = document.getElementById('mapModalTitle');
                  const info = document.getElementById('mapModalInfo');

                  title.textContent = name + ' の打刻場所';
                  info.textContent = '現場: ' + site + ' ／ 始業: ' + time;
                  modal.classList.remove('hidden');

                  setTimeout(function() {
                    if (modalMap) {
                      modalMap.remove();
                    }
                    modalMap = L.map('modalMap').setView([lat, lng], 16);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                      attribution: '© OpenStreetMap'
                    }).addTo(modalMap);
                    L.marker([lat, lng]).addTo(modalMap)
                      .bindPopup(esc(name) + '<br>' + esc(site)).openPopup();
                  }, 100);
                });
              }
            });
          });

          // 詳細モーダルを閉じる
          const closeDetailBtn = document.getElementById('closeDetailModal');
          if (closeDetailBtn) {
            closeDetailBtn.addEventListener('click', function() {
              document.getElementById('attendanceDetailModal').classList.add('hidden');
            });
          }

          // 地図モーダルを閉じる
          const closeBtn = document.getElementById('closeMapModal');
          if (closeBtn) {
            closeBtn.addEventListener('click', function() {
              document.getElementById('mapModal').classList.add('hidden');
              if (modalMap) {
                modalMap.remove();
                modalMap = null;
              }
            });
          }
        }

        // 従業員マスタ
        if (view === 'employeeMaster') {
          const addBtn = document.getElementById('addEmployeeBtn');
          if (addBtn) {
            addBtn.addEventListener('click', function() {
              const name = document.getElementById('newEmpName').value.trim();
              const role = document.getElementById('newEmpRole').value;
              const rate = parseInt(document.getElementById('newEmpRate').value) || (role === 'parttime' ? 1200 : 15000);
              const password = document.getElementById('newEmpPassword').value || '1234';

              if (!name) {
                alert('従業員名を入力してください');
                return;
              }

              // 【v3.2.0】非数値ID混在時のNaN採番を防止（削除済み従業員のIDとも衝突させない）
              const idPool = App.employees.concat(App.deletedEmployees || [])
                .map(e => parseInt(e.id, 10))
                .filter(n => Number.isFinite(n));
              const maxId = idPool.length > 0 ? Math.max(...idPool) : 11;
              const newId = (maxId + 1).toString();

              const newEmp = {
                id: newId,
                name: name,
                role: role,
                dailyRate: role === 'parttime' ? 0 : rate,
                hourlyRate: role === 'parttime' ? rate : 0,
                isActive: true,
                password: password
              };
              App.employees.push(newEmp);
              App.save();
              self.render('employeeMaster');
            });
          }

          // 新規登録フォームの役割変更時にラベル切り替え
          const newEmpRole = document.getElementById('newEmpRole');
          if (newEmpRole) {
            newEmpRole.addEventListener('change', function() {
              const label = document.getElementById('newEmpRateLabel');
              const input = document.getElementById('newEmpRate');
              if (this.value === 'parttime') {
                label.textContent = '時給';
                input.placeholder = '時給';
                input.value = '1200';
              } else {
                label.textContent = '日当';
                input.placeholder = '日当';
                input.value = '15000';
              }
            });
          }

          // 名前変更
          document.querySelectorAll('.save-name-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const empId = this.getAttribute('data-emp');
              const inputEl = document.querySelector('.name-input[data-emp="' + empId + '"]');
              const newName = inputEl.value.trim();
              if (!newName) {
                alert('名前を入力してください');
                return;
              }
              const emp = App.employees.find(e => e.id === empId);
              emp.name = newName;
              App.save();
              alert('名前を「' + newName + '」に変更しました');
              self.render('employeeMaster');
            });
          });

          // 日当/時給変更
          document.querySelectorAll('.save-rate-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const empId = this.getAttribute('data-emp');
              const inputEl = document.querySelector('.rate-input[data-emp="' + empId + '"]');
              const newRate = parseInt(inputEl.value);
              if (!newRate || newRate < 0) {
                alert('正しい金額を入力してください');
                return;
              }
              const emp = App.employees.find(e => e.id === empId);
              if (emp.role === 'parttime') {
                emp.hourlyRate = newRate;
                App.save();
                alert('時給を ¥' + newRate.toLocaleString() + ' に変更しました');
              } else {
                emp.dailyRate = newRate;
                App.save();
                alert('日当を ¥' + newRate.toLocaleString() + ' に変更しました');
              }
            });
          });

          // 有給付与日変更
          document.querySelectorAll('.save-paid-leave-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const empId = this.getAttribute('data-emp');
              const inputEl = document.querySelector('.paid-leave-input[data-emp="' + empId + '"]');
              const newDate = inputEl.value;
              const emp = App.employees.find(e => e.id === empId);
              emp.paidLeaveDate = newDate;
              App.save();
              if (newDate) {
                const d = new Date(newDate);
                alert('有給付与日を ' + d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 に設定しました');
              } else {
                alert('有給付与日をクリアしました');
              }
              self.render('employeeMaster');
            });
          });

          // 役割変更
          document.querySelectorAll('.save-role-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const empId = this.getAttribute('data-emp');
              const selectEl = document.querySelector('.role-select[data-emp="' + empId + '"]');
              const newRole = selectEl.value;
              const emp = App.employees.find(e => e.id === empId);
              const oldRole = emp.role;
              emp.role = newRole;
              
              // 役割が変わったら金額をリセット
              if (newRole === 'parttime' && oldRole !== 'parttime') {
                emp.hourlyRate = 1200;
                emp.dailyRate = 0;
              } else if (newRole !== 'parttime' && oldRole === 'parttime') {
                emp.dailyRate = 15000;
                emp.hourlyRate = 0;
              }
              
              App.save();
              const roleText = newRole === 'manager' ? '責任者' : (newRole === 'parttime' ? 'アルバイト' : (newRole === 'subadmin' ? '管理者（副）' : '作業員'));
              alert('役割を「' + roleText + '」に変更しました');
              self.render('employeeMaster');
            });
          });

          // パスワード表示
          document.querySelectorAll('.show-password-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const empId = this.getAttribute('data-emp');
              const emp = App.employees.find(e => e.id === empId);
              const valueEl = document.querySelector('.password-value[data-emp="' + empId + '"]');
              if (valueEl.textContent === '••••') {
                valueEl.textContent = emp.password;
                this.textContent = '隠す';
              } else {
                valueEl.textContent = '••••';
                this.textContent = '表示';
              }
            });
          });

          // パスワード変更
          document.querySelectorAll('.change-password-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const empId = this.getAttribute('data-emp');
              const inputEl = document.querySelector('.password-input[data-emp="' + empId + '"]');
              const newPass = inputEl.value.trim();
              if (!newPass || newPass.length < 4) {
                alert('パスワードは4文字以上で入力してください');
                return;
              }
              const emp = App.employees.find(e => e.id === empId);
              emp.password = newPass;
              App.save();
              alert('パスワードを更新しました');
              inputEl.value = '';
            });
          });

          // 有効/無効切替
          document.querySelectorAll('.toggle-btn[data-emp]').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const empId = this.getAttribute('data-emp');
              const emp = App.employees.find(e => e.id === empId);
              emp.isActive = !emp.isActive;
              App.save();
              self.render('employeeMaster');
            });
          });

          // ID変更
          document.querySelectorAll('.save-id-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const oldId = this.getAttribute('data-emp');
              const inputEl = document.querySelector('.id-input[data-emp="' + oldId + '"]');
              const newId = inputEl.value.trim();
              
              if (!newId) {
                alert('IDを入力してください');
                return;
              }
              if (newId === oldId) {
                return;
              }
              // 重複チェック
              if (App.employees.find(e => e.id === newId)) {
                alert('このIDは既に使用されています');
                return;
              }
              
              if (!/^[0-9a-zA-Z_-]+$/.test(newId)) {
                alert('IDは半角英数字（-, _ 可）で入力してください');
                return;
              }
              App.changeEmployeeId(oldId, newId); // 【v3.2.0】勤怠記録・各種申請の参照も一括更新
              if (App.currentUser && App.currentUser.id === oldId) App.currentUser.id = newId;
              App.save();
              alert('IDを「' + newId + '」に変更しました');
              self.render('employeeMaster');
            });
          });

          // 従業員削除
          document.querySelectorAll('.delete-emp-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const empId = this.getAttribute('data-emp');
              const emp = App.employees.find(e => e.id === empId);
              
              if (!confirm('「' + emp.name + '」を削除しますか？\n\n※ 削除済み一覧から復旧できます')) {
                return;
              }
              
              // 削除済みリストに移動
              emp.deletedAt = new Date().toISOString();
              App.deletedEmployees.push(emp);
              App.employees = App.employees.filter(e => e.id !== empId);
              App.save();
              alert('削除しました');
              self.render('employeeMaster');
            });
          });

          // 従業員復旧
          document.querySelectorAll('.restore-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const empId = this.getAttribute('data-emp');
              const emp = App.deletedEmployees.find(e => e.id === empId);
              
              if (!confirm('「' + emp.name + '」を復旧しますか？')) {
                return;
              }
              
              // 従業員リストに戻す
              delete emp.deletedAt;
              App.employees.push(emp);
              App.deletedEmployees = App.deletedEmployees.filter(e => e.id !== empId);
              App.save();
              alert('復旧しました');
              self.render('employeeMaster');
            });
          });
        }

        // バックアップ管理
        if (view === 'backupManagement') {
          // バックアップ一覧を読み込み
          FirebaseSync.listBackups().then(function(backups) {
            const listDiv = document.getElementById('backupList');
            if (backups.length === 0) {
              listDiv.innerHTML = '<p style="color: #94a3b8;">バックアップがありません</p>';
              return;
            }
            
            let html = '';
            backups.forEach(function(backup) {
              const date = new Date(backup.backupDate);
              const dateStr = date.toLocaleDateString('ja-JP', {
                year: 'numeric', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
              });
              html += `

              const sourceSiteName = this.getAttribute('data-site-name');
              const sourceSite = App.jobSites.find(s => s.id === sourceSiteId);
              if (!sourceSite) return;
              
              // 統合先の現場を選択
              let siteOptions = '';
              App.jobSites.filter(s => s.id !== sourceSiteId).forEach((site, idx) => {
                siteOptions += (idx + 1) + ': ' + site.name + '\n';
              });
              
              const choice = prompt(
                `「${sourceSiteName}」を別の現場に統合します。\n` +
                `統合先を選択してください:\n\n` + siteOptions + '\n番号を入力:',
                ''
              );
              
              if (choice === null || choice === '') return;
              
              const targetSites = App.jobSites.filter(s => s.id !== sourceSiteId);
              const targetIdx = parseInt(choice) - 1;
              if (targetIdx < 0 || targetIdx >= targetSites.length) {
                alert('無効な番号です');
                return;
              }
              
              const targetSite = targetSites[targetIdx];
              
              if (!confirm(
                `「${sourceSiteName}」を「${targetSite.name}」に統合します。\n\n` +
                `・勤怠記録の現場名が変更されます\n` +
                `・収支データが統合されます\n` +
                `・元の現場は削除されます\n\n` +
                `よろしいですか？`
              )) return;
              
              // 1. 勤怠記録の現場名を変更
              App.records.forEach(r => {
                if (r.jobSiteId === sourceSiteId || r.jobSiteName === sourceSiteName) {
                  r.jobSiteId = targetSite.id;
                  r.jobSiteName = targetSite.name;
                }
              });
              
              // 2. 日報データを統合
              if (App.siteDailyReports) {
                if (App.siteDailyReports[sourceSiteName]) {
                  if (!App.siteDailyReports[targetSite.name]) {
                    App.siteDailyReports[targetSite.name] = {};
                  }
                  // 元の日報データをコピー（既存があれば上書きしない）
                  Object.keys(App.siteDailyReports[sourceSiteName]).forEach(date => {
                    if (!App.siteDailyReports[targetSite.name][date]) {
                      App.siteDailyReports[targetSite.name][date] = App.siteDailyReports[sourceSiteName][date];
                    }
                  });
                  delete App.siteDailyReports[sourceSiteName];
                }
              }
              
              // 3. 収支データを統合
              if (App.siteFinanceData) {
                if (App.siteFinanceData[sourceSiteName]) {
                  if (!App.siteFinanceData[targetSite.name]) {
                    App.siteFinanceData[targetSite.name] = App.siteFinanceData[sourceSiteName];
                  } else {
                    // 材料費などを合算
                    const source = App.siteFinanceData[sourceSiteName];
                    const target = App.siteFinanceData[targetSite.name];
                    if (source.materials && target.materials) {
                      Object.keys(source.materials).forEach(month => {
                        target.materials[month] = (target.materials[month] || 0) + (source.materials[month] || 0);
                      });
                    }
                  }
                  delete App.siteFinanceData[sourceSiteName];

              // 4. 元の現場を削除
              App.jobSites = App.jobSites.filter(s => s.id !== sourceSiteId);
              
              App.save();
              alert(`「${sourceSiteName}」を「${targetSite.name}」に統合しました`);
              self.render('siteMaster');
