<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>給与計算アプリ - 東京架設</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
         background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);min-height:100vh;color:#fff}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    .hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;
         background:rgba(255,255,255,.1);border-radius:12px;margin-bottom:20px;flex-wrap:wrap;gap:10px}
    .hdr h1{font-size:1.4em;color:#ffd700}
    .btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
    .btn-p{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
    .btn-p:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.4)}
    .btn-s{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}
    .btn-x{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
    .back{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;
          padding:7px 14px;border-radius:8px;cursor:pointer;margin-right:10px}
    .back:hover{background:rgba(255,255,255,.1)}

    /* ログイン */
    .lg-wrap{display:flex;justify-content:center;align-items:center;min-height:80vh}
    .lg-box{background:rgba(255,255,255,.1);padding:40px;border-radius:20px;
            width:100%;max-width:400px;backdrop-filter:blur(10px)}
    .lg-box h2{text-align:center;margin-bottom:28px;color:#ffd700;font-size:1.4em}
    .lg-box input{width:100%;padding:14px;margin-bottom:14px;border:none;border-radius:10px;
                  background:rgba(255,255,255,.1);color:#fff;font-size:15px}
    .lg-box input::placeholder{color:rgba(255,255,255,.45)}
    .lg-box .btn{width:100%;padding:14px;font-size:15px}
    .lg-err{color:#ff6b6b;text-align:center;margin-top:10px;font-size:13px;display:none}

    /* メニュー */
    .mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:20px}
    .mcard{background:rgba(255,255,255,.1);padding:24px;border-radius:14px;
           text-align:center;cursor:pointer;transition:all .3s}
    .mcard:hover{transform:translateY(-5px);background:rgba(255,255,255,.15)}
    .mcard .ic{font-size:2.4em;margin-bottom:10px}
    .mcard h3{margin-bottom:6px}
    .mcard p{color:rgba(255,255,255,.65);font-size:12px}

    /* テーブル */
    .tbl-wrap{background:rgba(255,255,255,.08);border-radius:14px;padding:20px;overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
    th{background:rgba(255,255,255,.08);font-weight:600;white-space:nowrap}
    tr:hover td{background:rgba(255,255,255,.04)}
    .ar{text-align:right}.neg{color:#f45c43}.pos{color:#38ef7d}.gold{color:#ffd700;font-weight:700}

    /* フォーム */
    .fg{margin-bottom:14px}
    .fg label{display:block;margin-bottom:5px;font-size:13px;font-weight:500}
    .fg input,.fg select{width:100%;padding:11px;border:none;border-radius:8px;
                          background:rgba(255,255,255,.1);color:#fff;font-size:13px}
    .fg select option{background:#16213e}
    .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}

    /* カード */
    .card{background:rgba(255,255,255,.08);border-radius:14px;padding:18px;margin-bottom:18px}
    .ch{display:flex;justify-content:space-between;align-items:center;
        margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
    .ch h3{color:#ffd700}

    /* 月セレクタ */
    .mbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
    .mbar select{padding:9px 13px;border:none;border-radius:8px;
                 background:rgba(255,255,255,.1);color:#fff;font-size:13px}
    .mbar select option{background:#16213e}

    /* ローディング */
    #ld{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);
        display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:9999}
    .sp{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);
        border-top:4px solid #ffd700;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* 個人詳細 */
    .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:680px){.dgrid{grid-template-columns:1fr}}
    .sr{display:flex;justify-content:space-between;padding:6px 0;
        border-bottom:1px solid rgba(255,255,255,.06)}
    .sr:last-child{border:none}
    .stot{font-size:1.2em;font-weight:700;color:#ffd700;padding-top:8px}

    /* アップロード */
    .uarea{border:2px dashed rgba(255,255,255,.25);border-radius:12px;padding:28px;
           text-align:center;cursor:pointer;transition:all .3s}
    .uarea:hover{border-color:#ffd700;background:rgba(255,215,0,.05)}
    .uarea.ok{border-color:#38ef7d;background:rgba(56,239,125,.05)}

    /* バッジ */
    .bdg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
    .bdg-g{background:rgba(56,239,125,.2);color:#38ef7d}
    .bdg-y{background:rgba(255,215,0,.2);color:#ffd700}

    /* プレビュー */
    .pvbox{background:#0d1117;padding:14px;border-radius:8px;font-family:monospace;
           font-size:11px;white-space:pre;max-height:360px;overflow:auto}

    .note{font-size:11px;color:rgba(255,255,255,.45);margin-top:3px}
    input[type="number"]{-moz-appearance:textfield}
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none}
  </style>
</head>

  var bin = atob(b64s);

// HTMLエスケープ（XSS対策: DB由来の氏名・現場名を画面に出す前に必ず通す）
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

function taxCalc(x, d) {
  x = Math.floor(x); d = Math.max(0, Math.floor(d || 0));
  var d7 = Math.min(d, 7), t;
  if (!(x >= 105000)) {
    t = 0;
  } else if (x < 740000) {
    var lo = 0, hi = TAXT.length - 1;
    while (lo < hi) { var m = (lo + hi + 1) >> 1; if (TAXT[m][0] <= x) lo = m; else hi = m - 1; }
    t = TAXT[lo][d7 + 1];
  } else {
    var a = TANCH[0];
    for (var i = 1; i < TANCH.length; i++) { if (x >= TANCH[i][0]) a = TANCH[i]; }
    t = a[d7 + 1] + Math.floor((x - a[0]) * a[9]);
  }
  if (d > 7) t = Math.max(0, t - 1610 * (d - 7));
  return t;
}

  // 明細サマリ本文の生成（Excel明細と同じ式で計算。夜勤は明細書どおり一律×1.25）
  mailBody: function(empId, name, yr, mo) {
    var m = this.master[empId] || {};
    var at = this.attend(empId, yr, mo);
    var f = function(n){ return (n||0).toLocaleString(); };
    var wk = yr - 2018;
    var L = [name + ' 様', '',
      '令和' + wk + '年' + mo + '月分の給与明細が確定しましたのでお知らせいたします。', ''];
    if (this.mailCfg().withAmounts === false) {
      L.push('明細書の内容は事務所で配布する原本をご確認ください。');
      L.push('');
      L.push('※本メールは自動送信です。');
      L.push('株式会社東京架設');
      return L.join('\n');
    }
    var w = m.wage || 0, gross, nightN = at.nL + at.nS;
    L.push('【支給】');
    if (m.monthly) {
      gross = w;
      L.push('　報酬月額　' + f(gross) + '円');
    } else {
      var dayP = w * at.dayCnt;
      var halfP = Math.round(w * at.halfCnt / 2);
      var nightP = Math.round(w * 1.25) * nightN;   // 明細書のK4式と同じ一律1.25
      var famP = m.family || 0;
      var otP = Math.round(w * at.otSum / 8);
      gross = dayP + halfP + nightP + famP + otP;
      L.push('　日勤 ' + at.dayCnt + '日　' + f(dayP) + '円');
      if (at.halfCnt) L.push('　半日 ' + at.halfCnt + '日　' + f(halfP) + '円');
      if (nightN) L.push('　夜勤 ' + nightN + '日　' + f(nightP) + '円');
      if (otP) L.push('　残業 ' + at.otSum + '時間　' + f(otP) + '円');
      if (famP) L.push('　家族手当　' + f(famP) + '円');
    }
    L.push('　支給計　' + f(gross) + '円');
    L.push('');
    var empIns = m.monthly ? 0 : Math.ceil(gross * this.insRate() / 1000);
    var itemSum = 0, siSum = 0;
    (m.items || []).forEach(function(it) {
      var a = (it.amount || 0) * (it.kind === 'add' ? -1 : 1);
      itemSum += a;
      if (isSILabel(it.label)) siSum += a;
    });
    var socNet = gross - empIns - siSum;
    var hasOv = (m.taxOverride !== null && m.taxOverride !== undefined && m.taxOverride !== '');
    var tax = hasOv ? Math.round(m.taxOverride) : taxCalc(socNet, m.fuyo || 0);
    L.push('【控除等】');
    if (empIns) L.push('　雇用保険料　△' + f(empIns) + '円');
    (m.items || []).forEach(function(it) {
      var a = it.amount || 0;
      if (!a) return;
      L.push('　' + it.label + '　' + (it.kind === 'add' ? '＋' : '△') + f(a) + '円');
    });
    L.push('　所得税　△' + f(tax) + '円' + (hasOv ? '（手動設定）' : '（扶養' + (m.fuyo || 0) + '人・自動計算）'));
    L.push('');
    L.push('【差引支給額】　' + f(gross - empIns - itemSum - tax) + '円');
    L.push('');
    L.push('※本メールは自動送信です。金額は明細書と同じ式で計算していますが、Excel原本を手修正した場合は原本を優先します（端数調整で±1円の差が出ることがあります）。');
    L.push('株式会社東京架設');
    return L.join('\n');
  },

  // ＋ 役員（椙山・寺本）の初期シード
  migMaster: function() {

    var FIX7 = [

  // 勤怠集計
  attend: function(empId, yr, mo) {
    var p  = function(n){ return String(n).padStart(2,'0'); };
    var s0 = yr+'-'+p(mo)+'-01';
    var s1 = yr+'-'+p(mo)+'-31';
    var inMonth = function(r){
      return r.employeeId===empId && r.workDate>=s0 && r.workDate<=s1;
    };
    // 出勤打刻のあるレコードは全て計上（日給制＝現場に行った事実で1日。
    //   退勤打刻を忘れただけの日を無給の休扱いにしない。時刻なし手動記録 status:'completed' も含む）
    var recs = this.records.filter(function(r){
      return inMonth(r) && (r.status==='completed' || r.clockOutTime || r.clockInTime);
    });
    // 退勤時刻の未記録（working）は計上した上で警告として返す
    var open = this.records.filter(function(r){
      return inMonth(r) && r.status==='working' && !r.clockOutTime;
    });
    var daily = {};
    recs.forEach(function(r){
      var d = parseInt(r.workDate.split('-')[2], 10);
      if (!daily[d]) daily[d] = {day:false, night:false, half:false, sites:[], nightSites:[]};
      if (r.shiftType === 'night') {
        daily[d].night = true;
        var nn = r.jobSiteName || '';
        if (nn && daily[d].nightSites.indexOf(nn) < 0) daily[d].nightSites.push(nn);
      } else if (r.shiftType === 'half') {
        daily[d].half = true;
        var hn = r.jobSiteName || '';
        if (hn && daily[d].sites.indexOf(hn) < 0) daily[d].sites.push(hn);
      } else {
        daily[d].day = true;
        var dn = r.jobSiteName || '';
        if (dn && daily[d].sites.indexOf(dn) < 0) daily[d].sites.push(dn);
      }
    });
    // 承認済み残業申請を日別合算（明細E列＝時間数）
    var ot = {};
    (this.overtime || []).forEach(function(q){
      if (q.employeeId===empId && q.status==='approved' &&
          q.workDate>=s0 && q.workDate<=s1) {
        var d = parseInt(q.workDate.split('-')[2], 10);
        ot[d] = (ot[d] || 0) + (parseFloat(q.hours) || 0);
      }
    });
    var dayCnt=0, halfCnt=0, nL=0, nS=0, otSum=0;
    Object.keys(daily).forEach(function(k){
      var d = daily[k];
      if (d.day)   dayCnt++;
      else if (d.half) halfCnt++;   // 同日に日勤記録があれば1日を優先
      if (d.night) { if (d.day || d.half) nS++; else nL++; }
    });
    Object.keys(ot).forEach(function(k){ otSum += ot[k]; });
    return {dayCnt:dayCnt, halfCnt:halfCnt, nL:nL, nS:nS, daily:daily,
            ot:ot, otSum:otSum,
            openDates: open.map(function(r){ return r.workDate; })};
  },

  // 表示用: 1日分の現場名テキスト（日勤・夜勤の組合せ対応）
  siteText: function(dd) {
    if (!dd) return '';
    var ds = dd.sites.join('・'), ns = dd.nightSites.join('・');
    if (dd.day && dd.night) {
      if (ds === ns && ds) return ds;
      return '日勤：'+ds+'\n夜勤：'+ns;
    }
    return dd.day ? ds : ns;
  },

  // 給与計算（画面表示の参考額。確定額は明細書Excelの数式が計算する）
  calc: function(empId, yr, mo) {
    var m  = this.master[empId] || {};
    var at = this.attend(empId, yr, mo);
    var w  = m.wage || 0;
    var nLW= Math.round(w*1.25);   // 夜勤長：日給×1.25
    var nSW= Math.round(w*1.125);  // 夜勤短：日給×1.125
    var dayP=0, halfP=0, nLP=0, nSP=0, famP=0, otP=0;
    if (!m.monthly) {
      dayP = w * at.dayCnt;
      halfP = Math.round(w * at.halfCnt / 2);
      nLP  = nLW * at.nL;
      nSP  = nSW * at.nS;
      famP = m.family || 0;
      otP  = Math.round(w * at.otSum / 8);  // 残業手当＝日給×時間÷8（明細書と同式）
    }
    var gross  = m.monthly ? w : (dayP+halfP+nLP+nSP+famP+otP);
    var insRt  = this.insRate();
    var empIns = m.monthly ? 0 : Math.ceil(gross * insRt / 1000); // 雇用保険＝計×設定率/1000切上げ（明細書と同式）
    var items  = m.items || [];
    var itemSum = 0, siSum = 0;
    items.forEach(function(it){
      var a = (it.amount || 0) * (it.kind === 'add' ? -1 : 1);  // 支給・還付(＋)は控除の逆符号
      itemSum += a;
      if (isSILabel(it.label)) siSum += a;
    });
    var socNet = gross - empIns - siSum;   // 社会保険料等控除後の給与等の金額
    var hasOv  = (m.taxOverride !== null && m.taxOverride !== undefined && m.taxOverride !== '');
    var tax    = hasOv ? Math.round(m.taxOverride) : taxCalc(socNet, m.fuyo || 0);
    var totalDed = empIns + itemSum + tax;
    return {at:at, w:w, nLW:nLW, nSW:nSW,
            dayP:dayP, halfP:halfP, nLP:nLP, nSP:nSP, famP:famP, otP:otP,
            gross:gross, empIns:empIns, items:items,
            socNet:socNet, tax:tax, taxAuto:!hasOv, fuyo:m.fuyo||0,
            totalDed:totalDed, net:gross-totalDed, monthly:!!m.monthly};
  },

  bLogin: function() {
    var self = this;
    var doLogin = function() {
      var btn = document.getElementById('loginBtn');
      var err = document.getElementById('lgErr');
      var pw  = document.getElementById('pw').value;
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'ログイン中...';
      self.ensureAuth(4000).then(function() {
        return _db.collection('kintaiData').doc('main').get();
      }).then(function(doc) {
        var data = doc.exists ? doc.data() : null;
        if (self.checkAdminPw(data, pw)) {
          sessionStorage.setItem('kyuyoAuth', '1');
          self.kintaiCache = data;   // 起動時の再読込を省略
          self.showLd('勤怠データ読み込み中...');
          self.loadData().then(function() {
            self.hideLd(); self.view = 'menu'; self.render();
          });
        } else {
          btn.disabled = false; btn.textContent = 'ログイン';
          err.textContent = 'パスワードが正しくありません（勤怠アプリの管理者パスワードを入力してください）';
          err.style.display = '';
        }
      }).catch(function(e) {
        btn.disabled = false; btn.textContent = 'ログイン';
        var code = (e && e.code) || '';
        var txt  = code + ' ' + ((e && e.message) || '');
        if (/network|unavailable|failed/i.test(txt)) {
          err.innerHTML = 'サーバーに接続できません（ネットワークエラー）。<br>'+
            '・インターネット接続を確認してください<br>'+
            '・広告ブロッカー等の拡張機能が原因のことがあります（シークレットウィンドウで開くと切り分けできます）<br>'+
            '・社内ネットワークの場合、firestore.googleapis.com への通信許可が必要です';
        } else if (code === 'permission-denied') {
          err.textContent = 'Firestoreへのアクセスが拒否されました。セキュリティルール変更後は、Firebase Consoleで匿名認証（Anonymous）の有効化が必要です。';
        } else {
          err.textContent = 'Firestoreに接続できません（' + (code || (e && e.message)) + '）。';
        }
        err.style.display = '';
      });
    };
    document.getElementById('loginBtn').onclick = doLogin;
    document.querySelectorAll('.lg-box input').forEach(function(inp){
      inp.addEventListener('keypress', function(e){ if(e.key==='Enter') doLogin(); });
    });
  },

  // ===== Excel生成（JSZip方式：元ファイルのXMLのセル値だけ差し替え）=====
  // 書き込むもの:
  //   1. 各従業員シートの A1タイトル と 日別勤怠グリッド（行3〜33のA〜H列）
  //   2. 控除欄: I列ラベル（健康保険料/厚生年金/住民税など）を読んで同じ行のK列に金額を書き込み。
  //      アプリのマスタに無いラベル行（供託金など手動管理分）には触れない。
  //      マスタにあってシートに無い項目は「計」と「差引支給額」の間の空き行に追加。
  //   3. 所得税: 「所得税」ラベル行のK列に税額表参照式を書き込み（隠しシート「税額表」を自動追加）。
  //      → Excel側で有給・半日・控除を修正しても所得税が自動で追随する。
  // 罫線・フォント・結合・列幅・印刷設定・シート固有の数式は一切変更しない。
  genExcel: function(yr, mo) {
    var self = this;
    if (typeof JSZip === 'undefined') {
      return Promise.reject(new Error('JSZipの読み込みに失敗しています。インターネット接続を確認してページを再読み込みしてください'));
    }
    var NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
    var lastDay = new Date(yr, mo, 0).getDate();
    var reiwa = yr - 2018;
    var title = '令和'+reiwa+'年'+mo+'月分給与明細書';
    var xmlUnesc = function(s){
      return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
              .replace(/&apos;/g,"'").replace(/&amp;/g,'&');
    };
    var xmlEsc = function(s){
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;');
    };
    var colIdx = function(letter){
      var n=0; for (var i=0;i<letter.length;i++) n = n*26 + (letter.charCodeAt(i)-64);
      return n;
    };
    // <si>/<is>要素から本文テキストを抽出（<rPh>ふりがなは除外）
    var siText = function(el){
      var s = '', ch = el ? el.childNodes : null;
      if (!ch) return s;
      for (var i=0;i<ch.length;i++) {
        var n = ch[i];
        if (n.nodeType !== 1) continue;
        var nm = n.localName || n.nodeName;
        if (nm === 't') { s += n.textContent; }
        else if (nm === 'r') {
          var ts = n.getElementsByTagName('t');
          for (var k=0;k<ts.length;k++) s += ts[k].textContent;

                      var hS = origSOf('H'+row);
                      if (hS !== null) {
                        // 列幅は標準フォント基準の半角文字数 → 適正サイズ = 幅×標準サイズ÷文字units
                        var fit = Math.floor(hWidth * fontSzOf(0) / Math.max(1, maxU));
                        if (lines.length >= 2) {
                          // 2行表記: 行高24ptに2行収める縦上限8pt（元ファイルの手作り2行セルと同じ実績値）
                          setCellS('H'+row, fontVariant(hS, Math.max(7, Math.min(8, fit))));
                        } else if (fit < cellFontSz(hS)) {
                          // 1行でも幅を超える長さなら縮小（下限8pt）
                          setCellS('H'+row, fontVariant(hS, Math.max(8, fit)));
                        }
                      }
                    } else {
                      clr('H'+row);
                    }
                  } else {
                    ['A','B','C','D','E','F','G','H'].forEach(function(cL){ clr(cL+row); });
                  }
                }

                // ---- 2) 控除欄（I列ラベルで行を特定して書き込み）----
                var ded = [], untracked = [], noSlot = [];
                var lab2row = {};
                for (var r2=2; r2<=36; r2++) {
                  var lb = nrmLabel(cellText('I'+r2));
                  if (lb && lab2row[lb] === undefined) lab2row[lb] = r2;
                }
                var rowCalc = lab2row['計'], rowNet = lab2row['差引支給額'], rowTax = lab2row['所得税'];
                if (rowCalc && rowNet && rowTax && rowCalc < rowTax && rowTax < rowNet) {
                  // 差引式のSUM範囲（この範囲外に書くと集計されないため検証に使う）
                  var sumM = /SUM\(K(\d+):K(\d+)\)/.exec(getFml('K'+rowNet));
                  var rLo = sumM ? parseInt(sumM[1],10) : rowCalc;
                  var rHi = sumM ? parseInt(sumM[2],10) : rowNet-1;
                  // 空き行（計と差引の間、Iラベル無し・K値無し）
                  var free = [];
                  for (var fr=rowCalc+1; fr<rowNet; fr++) {
                    if (!nrmLabel(cellText('I'+fr)) && !hasVal('K'+fr)) free.push(fr);
                  }
                  var written = {};
                  written[rowTax] = true;
                  (m.items || []).forEach(function(it){
                    var nl = nrmLabel(it.label);
                    if (!nl) return;
                    if (NOWRITE[nl]) {
                      ded.push('「'+it.label+'」はExcel側の式で管理されるため書き込み対象外');
                      return;
                    }
                    var tr = lab2row[nl];
                    if (tr !== undefined && (tr <= rowCalc || tr >= rowNet)) tr = undefined;
                    var isNew = false;
                    if (tr === undefined) {
                      if (!free.length) { noSlot.push(it.label); return; }
                      tr = free.shift(); isNew = true;
                      setStr('I'+tr, it.label);
                      lab2row[nl] = tr;   // 社保後の合成式・管理外判定が新行を認識できるように
                      // 空き行に残っていた書式の残骸（8pt・赤字等）を、標準の控除行の書体に統一
                      var refRow = lab2row[nrmLabel('領収書返金')] || rowCalc;
                      var iS0 = origSOf('I'+tr), kS0 = origSOf('K'+tr);
                      var iRef = origSOf('I'+refRow), kRef = origSOf('K'+refRow);
                      if (iS0 !== null && iRef !== null) setCellS('I'+tr, fontRefVariant(iS0, iRef));
                      if (kS0 !== null && kRef !== null) setCellS('K'+tr, fontRefVariant(kS0, kRef));
                    }
                    var oldV = getNumV('K'+tr);
                    var srcAmt = it.amount || 0;
                    if (nl === '住民税' && mo === 6 && (m.resTaxFirst || 0) > 0) srcAmt = m.resTaxFirst;
                    var amt = Math.abs(Math.round(srcAmt));
                    var newV = (it.kind === 'add') ? amt : -amt;   // 支給・還付(＋)はプラスで記載
                    setNum('K'+tr, newV);
                    written[tr] = true;
                    var d1 = it.label+' '+(newV>0?'+':'')+newV.toLocaleString();
                    if (nl === '住民税' && mo === 6 && (m.resTaxFirst || 0) > 0) d1 += '【6月分＝1回目額】';
                    if (it.kind === 'add') d1 += isSILabel(it.label) ? '【課税・社保後に合算→所得税再計算】' : '【非課税】';
                    if (isNew) d1 += '（空き行'+tr+'に追加）';
                    else if (!job.create && oldV !== undefined && oldV !== newV) d1 += '（変更: '+oldV.toLocaleString()+'→'+newV.toLocaleString()+'）';
                    if (tr < rLo || tr > rHi) d1 += ' ⚠差引式の範囲外（Excelで差引式の範囲を確認）';
                    ded.push(d1);
                  });
                  // 雇用保険料：設定率で式を書き込み（率改定に追随）。役員（月額報酬の自動作成）は0のまま
                  var insRow = lab2row['雇用保険料'];
                  if (insRow && insRow > rowCalc && insRow < rowNet && !(m.monthly && job.create)) {
                    var oldInsF = (getFml('K'+insRow) || '') + ' ' + (getFml('L'+insRow) || '');
                    var oldRateM = /([0-9.]+)\s*\/\s*1000/.exec(oldInsF);
                    setFml('K'+insRow, 'ROUNDUP(K'+rowCalc+'*-'+insRateVal+'/1000,0)');
                    clr('L'+insRow);   // 旧テンプレの中間式（L列・印刷範囲外）を掃除
                    written[insRow] = true;
                    var dIns = '雇用保険料＝式（計×'+insRateVal+'/1000・切上げ）';
                    if (oldRateM && parseFloat(oldRateM[1]) !== insRateVal) {
                      dIns += '　率を '+oldRateM[1]+' → '+insRateVal+' に更新';
                    }
                    ded.push(dIns);
                  }

                  // 住民税の徴収回数（6月分=1回目〜翌5月分=12回目）をJ列に表示
                  var rowRes = lab2row['住民税'];
                  if (rowRes && rowRes > rowCalc && rowRes < rowNet) {
                    var resIt = (m.items || []).find(function(it){ return nrmLabel(it.label) === '住民税'; });
                    var kai = ((mo - 6 + 12) % 12) + 1;
                    if (resIt && (resIt.amount || 0) > 0) {
                      setStr('J'+rowRes, kai+'回目');
                      ded.push('住民税の回数: '+kai+'回目（6月分=1回目〜翌5月分=12回目・J列に表示）');
                    } else {
                      var jOld = nrmLabel(cellText('J'+rowRes) || '');
                      if (!jOld || jOld.indexOf('回目') >= 0 || jOld.indexOf('REF') >= 0) clr('J'+rowRes);  // 回数表記・壊れ参照のみ掃除（「未徴収」等の手書きメモは温存）
                    }
                  }
                  // 所得税：社保系ラベルの行（還付・調整の追加行を含む）を全て社保後に合算
                  var siRows = [];
                  Object.keys(lab2row).forEach(function(nl2){
                    if (!isSILabel(nl2)) return;
                    var rr = lab2row[nl2];
                    if (rr > rowCalc && rr < rowNet && siRows.indexOf(rr) < 0) siRows.push(rr);
                  });
                  siRows.sort(function(a,b){ return a-b; });
                  var oldTax = getNumV('K'+rowTax);
                  var hasOv = (m.taxOverride !== null && m.taxOverride !== undefined && m.taxOverride !== '');
                  if (hasOv) {
                    setNum('K'+rowTax, -Math.abs(Math.round(m.taxOverride)));
                    ded.push('所得税 '+(-Math.abs(Math.round(m.taxOverride))).toLocaleString()+'（手動上書き）');
                  } else {
                    var soc = '(K'+rowCalc + siRows.map(function(rr){ return '+K'+rr; }).join('') + ')';
                    setFml('K'+rowTax, taxFormula(soc, m.fuyo || 0));
                    var d2 = '所得税＝税額表の式（扶養'+(m.fuyo||0)+'人・社保後'+soc.replace(/[()]/g,'')+'）';
                    if (!job.create && oldTax !== undefined) d2 += '　前回値 '+oldTax.toLocaleString()+' → 開くと自動計算';
                    ded.push(d2);
                  }
                  // アプリ管理外の控除行（前月値が残るため通知）
                  var itemLabs = {};
                  (m.items||[]).forEach(function(it){ itemLabs[nrmLabel(it.label)] = 1; });
                  for (var ur=rowCalc+1; ur<rowNet; ur++) {
                    if (written[ur]) continue;
                    var ulb = nrmLabel(cellText('I'+ur));
                    if (!ulb || ulb === '雇用保険料' || ulb === '領収書返金') continue;
                    if (itemLabs[ulb]) continue;
                    if (hasVal('K'+ur)) {
                      var uv = getNumV('K'+ur);
                      untracked.push(cellText('I'+ur).trim()+(uv!==undefined?(' '+uv.toLocaleString()):'')+'（行'+ur+'・前回のまま）');
                    }
                  }
                } else {
                  ded.push('⚠ 控除欄の構造（計／所得税／差引支給額のラベル）を特定できなかったため、このシートは勤怠のみ書き込みました');
                }

                var out = decl + ser.serializeToString(doc.documentElement);
                zip.file(job.sheet.path, out);
                report.push({name: job.emp.name, sheet: job.sheet.name,
                             dayCnt: at.dayCnt, halfCnt: at.halfCnt, nL: at.nL, nS: at.nS,
                             otSum: at.otSum, openDates: at.openDates,
                             created: !!job.create, monthly: !!m.monthly,
                             ded: ded, untracked: untracked, noSlot: noSlot});
              });
            });

            return Promise.all(procs).then(function(){
              // ---- スタイル変種を書き戻し ----
              if (stylesChanged) {
                zip.file('xl/styles.xml', styDecl + ser.serializeToString(styDoc.documentElement));
              }
              // ---- 3) 隠しシート「税額表」を追加（既存なら中身だけ更新）----
              var taxXml = buildTaxXml();
              if (taxSheetEntry) {
                zip.file(taxSheetEntry.path, taxXml);
              } else {
                zip.file('xl/worksheets/zeigakuhyo.xml', taxXml);
                addNewSheet('税額表', 'worksheets/zeigakuhyo.xml', true);
              }
              // 自動作成した従業員シートを登録
              jobs.forEach(function(job){
                if (job.create) addNewSheet(job.sheet.name, job.target, false);
              });
              flushNewSheets();
              // 計算順キャッシュ（calcChain）を除去：本アプリは式の追加・書換・削除を行うため、
              // 古いキャッシュが残るとExcelが「修復」ダイアログを出す。除去すれば開いた時に
              // 全再計算（fullCalcOnLoad済み）とともに自動再構築されるので安全
              if (zip.file('xl/calcChain.xml')) {
                zip.remove('xl/calcChain.xml');
                ctXml = ctXml.replace(/<Override PartName="\/xl\/calcChain\.xml"[^>]*\/>/, '');
                relXml = relXml.replace(/<Relationship[^>]*calcChain\.xml"[^>]*\/>/, '');
                zip.file('[Content_Types].xml', ctXml);
                zip.file('xl/_rels/workbook.xml.rels', relXml);
              }

              // ---- 4) 開いた時に全数式を再計算 ----
              if (!/fullCalcOnLoad/.test(wbXml)) {
                if (/<calcPr[^>]*\/>/.test(wbXml)) {
                  wbXml = wbXml.replace(/<calcPr([^>]*?)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>');
                } else {
                  wbXml = wbXml.replace('</workbook>', '<calcPr fullCalcOnLoad="1"/></workbook>');
                }
              }
              zip.file('xl/workbook.xml', wbXml);

              return zip.generateAsync({
                type: 'blob',
                compression: 'DEFLATE',
                mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
              });
            }).then(function(blob){
              var a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = '給料明細書_令和'+reiwa+'年'+mo+'月分.xlsx';
              a.click();
              URL.revokeObjectURL(a.href);
              var noSheet = people.filter(function(e){ return !matchedEmpIds[e.id]; })
                                  .map(function(e){ return e.name; });
              self.showReport(yr, mo, report, warnSheets, noSheet, notes);
              resolve();
            });
          });
        }).catch(reject);
      };
      if (tplSrc.kind === 'file') {
        var reader = new FileReader();
        reader.onerror = function(){ reject(new Error('ファイル読み込みエラー')); };
        reader.onload = function(ev){ startWith(ev.target.result); };
        reader.readAsArrayBuffer(tplSrc.file);
      } else {
        startWith(tplSrc.u8);
      }
    });
  },

  // ===== 生成結果レポート =====
  showReport: function(yr, mo, report, warnSheets, noSheet, notes) {
    var rows = report.map(function(r){
      var w = r.openDates.length
        ? '<div style="color:#f0ad4e;font-size:12px;margin-top:2px">⚠ 退勤時刻の未記録: '+r.openDates.map(esc).join(', ')+'（出勤1日として計上済み。時刻を残したい場合は勤怠アプリの「従業員出勤履歴」→編集で退勤時刻を入力できます）</div>'
        : '';
      var d = (r.ded && r.ded.length)
        ? '<div style="font-size:12px;color:rgba(255,255,255,.62);margin-top:3px">'+r.ded.map(esc).join('<br>')+'</div>'
        : '';
      var u = (r.untracked && r.untracked.length)
        ? '<div style="font-size:12px;color:#ffd700;margin-top:3px">⚠ アプリ管理外の控除行: '+r.untracked.map(esc).join('、')+'</div>'
        : '';
      var n = (r.noSlot && r.noSlot.length)
        ? '<div style="font-size:12px;color:#f45c43;margin-top:3px">⚠ 空き行が足りず書き込めなかった項目: '+r.noSlot.map(esc).join('、')+'</div>'
        : '';
      var cr = r.created
        ? '<div style="color:#38ef7d;font-size:12px;margin-top:2px">✚ 明細シートを自動作成しました（'+(r.monthly?'月給/役員報酬仕様':'日給・雛形:月精晃大フォーマット')+'。領収書返金は0で初期化）</div>'
        : '';
      return '<div style="padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1)">'+
        '<b>'+esc(r.name)+'</b>'+(r.created?' <span style="color:#38ef7d;font-size:11px">NEW</span>':'')+'　日勤 '+r.dayCnt+'日'+(r.halfCnt?'／半日 '+r.halfCnt+'日':'')+'／夜勤 '+(r.nL+r.nS)+'日'+
        (r.nS ? '（うち日勤と同日 '+r.nS+'日）' : '')+
        (r.otSum ? '／残業 '+r.otSum+'h' : '')+ cr + w + d + u + n +'</div>';
    }).join('');
    var warns = '';
    if (warnSheets.length) {
      warns += '<div style="color:#ffd700;font-size:13px;margin-top:10px">⚠ 一致する従業員が見つからず<b>書き込まなかった</b>シート: '+
        warnSheets.map(esc).join('、')+'<br>（勤怠アプリの従業員名かシート名を合わせてください）</div>';
    }
    if (noSheet.length) {
      warns += '<div style="color:#ffd700;font-size:13px;margin-top:10px">⚠ 明細シートが無く自動作成もされなかった従業員: '+
        noSheet.map(esc).join('、')+'<br>（従業員マスタで日給/月給を設定して再出力すればシートが自動作成されます）</div>';
    }
    if (notes.length) {
      warns += '<div style="color:rgba(255,255,255,.55);font-size:12px;margin-top:10px">'+
        notes.map(esc).join('<br>')+'</div>';
    }
    var html =
      '<div id="rptOv" style="position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99;'+
        'display:flex;align-items:center;justify-content:center;padding:16px">'+
        '<div style="background:#16213e;border:1px solid rgba(255,255,255,.18);border-radius:14px;'+
          'max-width:600px;width:100%;max-height:82vh;overflow:auto;padding:22px">'+
          '<h3 style="color:#ffd700;margin-bottom:4px">✅ '+yr+'年'+mo+'月分を出力しました</h3>'+
          '<p style="font-size:12px;color:rgba(255,255,255,.55);margin-bottom:12px">'+
            '書き込んだのは<b>日別勤怠（A〜H列）・タイトル・控除欄の金額・所得税の式</b>。書式・日給・その他の数式は元のまま。<br>'+
            '所得税は隠しシート「税額表」（令和8年分・月額表甲欄）を参照する式なので、Excelで有給・半日・控除を直しても自動で追随します。<br>'+
            '有給・半日はExcelを開いて出欠欄を「有」「半」に書き換えれば式が自動計算します。</p>'+
          rows + warns +
          (report.length ? '<button class="btn btn-s" id="rptMail" style="margin-top:16px;width:100%">📧 メール送信へ（承認画面で内容確認）</button>' : '')+
          '<button class="btn btn-p" id="rptCl" style="margin-top:10px;width:100%">閉じる</button>'+
        '</div></div>';
    var d = document.createElement('div');
    d.innerHTML = html;
    document.body.appendChild(d.firstChild);
    document.getElementById('rptCl').onclick = function(){
      var o = document.getElementById('rptOv'); if (o) o.remove();
    };
    var mb = document.getElementById('rptMail');
    if (mb) mb.onclick = function(){
      var o = document.getElementById('rptOv'); if (o) o.remove();
      App.mailCtx = {yr: yr, mo: mo};
      App.view = 'mailprev'; App.render();
    };
  },

  // ===== メール送信・承認プレビュー =====
  vMailprev: function() {
    var self = this;
    if (!this.mailCtx) { this.view = 'menu'; return this.vMenu(); }
    var yr = this.mailCtx.yr, mo = this.mailCtx.mo;
    var subj = this.mailSubject(yr, mo);
    var targets = this.mailTargets(yr, mo);
    var cards = targets.map(function(t, i) {
      if (!t.ok) {
        return '<div class="card" style="opacity:.5;margin-bottom:10px"><b>'+esc(t.name)+'</b>　'+
          '<span style="color:#ffd700;font-size:12px">メール未登録（マスタで登録すると送信対象になります）</span></div>';
      }
      var body = self.mailBody(t.id, t.name, yr, mo);
      return '<div class="card" style="margin-bottom:10px">'+
        '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px">'+
          '<input type="checkbox" class="ml-chk" data-i="'+i+'" checked style="width:auto">'+
          '<b>'+esc(t.name)+'</b>　<span style="color:var(--tx2);font-size:13px">→ '+esc(t.email)+'</span>'+
        '</label>'+
        '<div style="font-size:12px;color:var(--tx2)">件名: '+esc(subj)+'</div>'+
        '<pre style="white-space:pre-wrap;font-size:12px;background:rgba(0,0,0,.25);padding:10px;border-radius:8px;margin-top:6px;font-family:inherit">'+esc(body)+'</pre>'+
        '</div>';
    }).join('');
    var okCnt = targets.filter(function(t){ return t.ok; }).length;
    return '<div class="hdr"><div><button class="back" id="back">← 戻る</button>'+
      '<span style="font-size:1.2em;font-weight:600">📧 令和'+(yr-2018)+'年'+mo+'月分 明細メール（承認前確認）</span></div></div>'+
      '<p style="margin-bottom:12px;color:var(--tx2);font-size:13px">'+
      '宛先と内容を確認してください。<b>「承認して送信」を押すと即時送信され、取り消せません。</b>送信結果はログに記録されます。<br>'+
      (this.mailCfg().adminEmail
        ? '📋 確認用コピー: 全通が <b>'+esc(this.mailCfg().adminEmail)+'</b> にBCCで届き、送信後に控え（結果一覧）も届きます。'
        : '<span style="color:#ffd700">⚠ 確認用BCCが未設定です。全体設定で自分のアドレスを登録すると、全通のコピーと送信控えが届きます。</span>')+'</p>'+
      cards +
      '<button class="btn btn-p" id="mlSend" style="width:100%;margin-top:6px"'+(okCnt?'':' disabled')+'>✅ 承認して送信</button>';
  },
  bMailprev: function() {
    var self = this;
    document.getElementById('back').onclick = function(){ self.view='menu'; self.render(); };
    var btn = document.getElementById('mlSend');
    var upd = function() {
      var n = document.querySelectorAll('.ml-chk:checked').length;
      btn.textContent = '✅ 承認して送信（' + n + '名）';
      btn.disabled = (n === 0);
    };
    document.querySelectorAll('.ml-chk').forEach(function(c){ c.onchange = upd; });
    upd();
    btn.onclick = function() {
      var yr = self.mailCtx.yr, mo = self.mailCtx.mo;
      var subj = self.mailSubject(yr, mo);
      var targets = self.mailTargets(yr, mo);
      var mails = [];
      var adminEmail = self.mailCfg().adminEmail || '';
      document.querySelectorAll('.ml-chk:checked').forEach(function(c) {
        var t = targets[parseInt(c.dataset.i, 10)];
        mails.push({to: t.email, subject: subj, name: t.name, empId: t.id,
                    bcc: adminEmail,
                    body: self.mailBody(t.id, t.name, yr, mo)});
      });
      if (!mails.length) return;
      if (!confirm(mails.length + '名に明細メールを送信します。この操作は取り消せません。よろしいですか？')) return;
      self.showLd('送信中...（' + mails.length + '件）');
      self.sendMails(mails).then(function(res) {
        self.hideLd();
        var results = (res && res.results) || [];
        var now = new Date().toISOString();
        var logs = mails.map(function(m, i) {
          var r = results[i] || {};
          return {ts: now, yr: yr, mo: mo, to: m.to, name: m.name,
                  status: r.ok ? 'ok' : 'error', error: r.error || null};
        });
        self.saveMailLog(logs);
        if (adminEmail) {
          self.sendMails([{to: adminEmail,
            subject: '【送信控え】' + subj,
            body: self.buildSummaryBody(yr, mo, logs)}])
            .catch(function(e){ console.warn('送信控えの送信に失敗:', e); });
        }
        var ngs = logs.filter(function(l){ return l.status !== 'ok'; });
        if (!ngs.length) {
          alert('✅ ' + mails.length + '名全員に送信しました。');
          self.view = 'menu'; self.render();
        } else {
          alert('⚠ ' + (mails.length - ngs.length) + '名に送信、' + ngs.length + '名が失敗:\n' +

  bMaster: function() {
    var self = this;
    document.getElementById('back').onclick = function(){ self.view='menu'; self.render(); };
    document.getElementById('addExec').onclick = function(){
      self.editId = '__newexec__'; self.view='edit'; self.render();
    };
    document.getElementById('cfgTestBtn').onclick = function(){
      var to = (document.getElementById('cfgTestTo').value || '').trim();
      if (to.indexOf('@') < 1) { alert('テスト宛先のメールアドレスを入力してください'); return; }
      // 未保存の入力値で一時的に送信設定を上書きしてテスト
      self.master['_config'] = self.master['_config'] || {};
      self.master['_config'].mail = {
        gasUrl: (document.getElementById('cfgGasUrl').value || '').trim(),
        gasToken: (document.getElementById('cfgGasToken').value || '').trim(),
        adminEmail: (document.getElementById('cfgAdminMail').value || '').trim(),
        withAmounts: document.getElementById('cfgWithAmt').checked
      };
      self.showLd('テスト送信中...');
      self.sendMails([{to: to, subject: '【東京架設】給与アプリ テスト送信',
        body: 'このメールが届いていれば、メール送信の設定は完了です。\n株式会社東京架設 給与計算アプリ'}])
      .then(function(res) {
        self.hideLd();
        var r0 = res && res.results && res.results[0];
        if (res && res.ok && r0 && r0.ok) alert('テスト送信に成功しました。受信を確認してください。');
        else alert('GASは応答しましたが送信に失敗: ' + ((r0 && r0.error) || (res && res.error) || '不明'));
      }).catch(function(e) {
        self.hideLd();
        alert('テスト送信エラー: ' + e.message + '\nURL・トークン・GASのデプロイ設定（全員アクセス可）を確認してください。');
      });
    };
    var tplBtn = document.getElementById('cfgTplBtn');
    var tplInp = document.getElementById('cfgTplFile');
    if (tplBtn) tplBtn.onclick = function(){ tplInp.click(); };
    if (tplInp) tplInp.onchange = function(e){
      var f = e.target.files[0];
      if (!f) return;
      if (f.size > 700 * 1024) { alert('700KBを超えています（Firestoreの保存上限のため）。不要シートを削るなどで軽量化してください。'); return; }
      self.showLd('テンプレートを検証中...');
      var rd = new FileReader();
      rd.onload = function(ev){
        var b64s = String(ev.target.result).split(',')[1] || '';
        JSZip.loadAsync(b64ToU8(b64s)).then(function(zip){
          if (!zip.file('xl/workbook.xml') || !zip.file('xl/styles.xml')) throw new Error('xlsx形式ではありません');
          var rec = {b64: b64s, name: f.name, updatedAt: new Date().toISOString()};
          return _db.collection('payrollData').doc('template').set(rec).then(function(){
            self.tplStored = rec;
          });
        }).then(function(){
          self.hideLd();
          alert('テンプレートを差し替えました。次回の出力から使われます。');
          self.render();
        }).catch(function(err){
          self.hideLd();
          alert('差し替え失敗: ' + err.message);
        });
      };
      rd.onerror = function(){ self.hideLd(); alert('ファイル読み込みエラー'); };
      rd.readAsDataURL(f);
    };
    var tplRst = document.getElementById('cfgTplReset');
    if (tplRst) tplRst.onclick = function(){
      if (!confirm('保存済みテンプレートを削除して、内蔵テンプレート（令和8年5月分ベース）に戻しますか？')) return;
      self.showLd('削除中...');
      _db.collection('payrollData').doc('template').delete().then(function(){
        self.tplStored = null;
        self.hideLd(); self.render();
      }).catch(function(e){ self.hideLd(); alert('削除失敗: ' + e.message); });
    };
    document.getElementById('cfgSave').onclick = function(){
      var r = parseFloat(document.getElementById('cfgInsRate').value);
      if (!(r > 0)) { alert('料率は正の数で入力してください（例: 6 / 6.5）'); return; }
      self.master['_config'] = self.master['_config'] || {};
      self.master['_config'].empInsRate = r;
      self.master['_config'].mail = {
        gasUrl: (document.getElementById('cfgGasUrl').value || '').trim(),
        gasToken: (document.getElementById('cfgGasToken').value || '').trim(),
        adminEmail: (document.getElementById('cfgAdminMail').value || '').trim(),
        withAmounts: document.getElementById('cfgWithAmt').checked
      };
      self.showLd('保存中...');
      self.saveMaster().then(function(){
        self.hideLd();
        alert('雇用保険料率を '+r+'/1000 に設定しました。次回のExcel出力から全員に反映されます。');
        self.render();
      }).catch(function(e){ self.hideLd(); alert('保存エラー: '+e.message); });
    };
    document.querySelectorAll('[data-id]').forEach(function(b){
      b.onclick = function(){ self.editId=b.dataset.id; self.view='edit'; self.render(); };
    });
  },

  bEdit: function() {

        self.saveMaster().then(function(){
          self.hideLd(); self.view='master'; self.render();
        });
      };

    document.getElementById('saveBtn').onclick = function(){
      var g = function(id){ return parseInt(document.getElementById(id).value)||0; };
      var isNewExec = (self.editId === '__newexec__');
      var prev = self.master[self.editId] || {};
      var isExec = isNewExec || !!prev.isExec;
      var exName = '';
      if (isExec) {
        exName = document.getElementById('exName').value.trim();
        if (!exName) { alert('役員の氏名を入力してください'); return; }
      }
      var items = Array.prototype.slice.call(document.querySelectorAll('#itList .it-row'))
        .map(function(row){
          var k4 = (row.querySelector('.it-kind') || {}).value || 'ded';
          return {
            label:  row.querySelector('.it-label').value.trim(),
            amount: parseInt(row.querySelector('.it-amount').value) || 0,
            kind:   (k4.indexOf('add') === 0) ? 'add' : 'ded',
            si:     (k4.indexOf('_si') > 0)
          };
        })
        .filter(function(it){ return it.label; });
      var ovRaw = document.getElementById('taxOv').value.trim();
      var saveId = isNewExec ? ('exec_' + Date.now()) : self.editId;
      var rec = {
        monthly: isExec ? true : (document.getElementById('isM').value==='1'),
        wage: g('wage'),
        email: (document.getElementById('empEmail').value || '').trim(),
        family: g('family'),
        resTaxFirst: g('resTaxFirst'),
        fuyo: Math.max(0, g('fuyo')),
        taxOverride: (ovRaw === '') ? null : (parseInt(ovRaw) || 0),
        items: items
      };
      if (isExec) { rec.isExec = true; rec.name = exName; }
      self.master[saveId] = rec;
      self.showLd('保存中...');
      self.saveMaster().then(function(){
        self.hideLd();
        alert('保存しました（翌月以降のExcel出力にも引き継がれます）');
        self.view='master'; self.render();
      }).catch(function(e){
        self.hideLd();
        alert('保存エラー: '+e.message);
      });
    };
  }
};
</script>
</body>
</html>
